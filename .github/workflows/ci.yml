  #     - name: Fail if gh CLI appears in pipeline runtime code
  #       run: |
  #         set -euo pipefail
  #         if grep -rnE '(^|[^[:alnum:]_."'"'"'])gh ' pipeline/wgmesh_pipeline/ --include='*.py'; then
  #           echo "::error::gh CLI usage found in pipeline runtime code — SDLC must stay forge-agnostic (U8 wall)."
  #           exit 1
  #         fi
  #         echo "No gh CLI usage in pipeline runtime code. PASS."
