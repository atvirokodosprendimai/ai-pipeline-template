name: Pipeline CI

# Runs the wgmesh_pipeline Python test suite on PRs touching pipeline/.
# First Python CI in this otherwise bash/yaml repo — scoped to pipeline/**
# so it never perturbs the existing shell workflows. Commits no LLM content
# (no gh issue/pr create), so it carries no sanitise obligation.

on:
  pull_request:
    paths:
      - 'pipeline/**'
  push:
    branches: [main]
    paths:
      - 'pipeline/**'

permissions:
  contents: read

jobs:
  pytest:
    # Bot PRs (bot/* head branches) skip this standalone Actions run — they
    # are gated at merge by the required impl-judge check plus the required
    # status checks. External/host PRs keep Actions CI via ci.yml (U10),
    # which runs unconditionally — so a branch named to dodge this filter
    # still gets the full ci.yml suite.
    if: github.event_name != 'pull_request' || !startsWith(github.event.pull_request.head.ref, 'bot/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pipeline package
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e pipeline/

      - name: Run tests (from repo root — dataset paths are repo-root-relative)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m pytest pipeline/tests/ -q

      - name: Run gate eval check
        env:
          PYTHONPATH: pipeline
        run: |
          set -euo pipefail
          python -m evals.run_evals --check
