name: Conflict Heal

# Bot-PR merge-lane heal across both repos (meta + seed). Three passes:
#
#   Pass A (rebase) — a bot PR goes CONFLICTING when main moves under it; such a
#   PR fires no pull_request workflows, so the judge never runs and it dead-ends.
#   Rebase onto main (--force-with-lease, bot-branches only) re-arms the lane; a
#   genuinely unresolvable conflict escalates to a human after two attempts.
#
#   Pass B (re-arm) — a MERGEABLE bot `fix:` PR can be stuck because its required
#   `impl-judge` check was never produced (it predates the judge workflow, so no
#   pull_request event ever fired it — an absent required check is permanently
#   pending, not red). Enable auto-merge + push an empty commit to fire the judge.
#   Pass B runs AFTER Pass A, so a PR the rebase already re-armed (force-push fires
#   the judge) is no longer a Pass-B candidate.
#
#   Pass C (stale-base rebase) — a MERGEABLE bot PR (no conflict) can still be RED
#   because its branch predates a since-merged fix to main: the failing check is
#   already resolved on current main. Rebase such PRs (behind main AND failing —
#   green/current PRs are never force-pushed) onto main so checks re-run against
#   the fixed tree; reuses Pass A's rebase.sh. Still red after two rebases ⇒ the
#   failure is in the PR's own diff ⇒ escalate to a human.
#
# Cron offset to 01/07/13/19 so it never overlaps pr-disposition's 0 */6.

on:
  schedule:
    - cron: '0 1,7,13,19 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print intended rebases/escalations without mutating GitHub or state.
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  HAS_APP_CREDS: ${{ vars.APP_ID != '' && secrets.APP_PRIVATE_KEY != '' }}

jobs:
  heal:
    name: Conflict-heal ${{ matrix.repo_label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - repo_label: meta
            target_repo: atvirokodosprendimai/ai-pipeline-template
          - repo_label: seed
            target_repo: atvirokodosprendimai/wgmesh
    concurrency:
      group: conflict-heal-${{ matrix.repo_label }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pipeline package
        run: |
          python -m pip install --upgrade pip
          pip install -e pipeline/

      # One token scoped to BOTH repos (same org): the target-repo gh/rebase
      # ops AND the meta state-commit both authenticate with it (KTD-7).
      - name: Generate GitHub App token
        id: app-token
        if: env.HAS_APP_CREDS == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ai-pipeline-template
            wgmesh

      - name: Select GitHub token
        run: |
          token="${{ steps.app-token.outputs.token }}"
          if [ -z "$token" ]; then
            token="${{ secrets.PUSH_TOKEN }}"
          fi
          if [ -z "$token" ]; then
            token="${{ secrets.GITHUB_TOKEN }}"
          fi
          if [ -z "$token" ]; then
            echo "::error::No GitHub App token, PUSH_TOKEN, or GITHUB_TOKEN available"
            exit 1
          fi
          echo "::add-mask::$token"
          echo "GH_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Run conflict-heal (Pass A — rebase CONFLICTING)
        env:
          TARGET_REPO: ${{ matrix.target_repo }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          CONFLICT_HEAL_STATE: company/conflict-heal-state-${{ matrix.repo_label }}.json
        run: |
          set -euo pipefail
          args=()
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          python company/scripts/conflict-heal/run.py "${args[@]}"

      - name: Run check-rearm (Pass B — re-arm MERGEABLE unjudged)
        env:
          TARGET_REPO: ${{ matrix.target_repo }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          CHECK_REARM_STATE: company/check-rearm-state-${{ matrix.repo_label }}.json
        run: |
          set -euo pipefail
          args=()
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          python company/scripts/check-rearm/run.py "${args[@]}"

      - name: Run stale-base-heal (Pass C — rebase MERGEABLE stale-base-broken)
        env:
          TARGET_REPO: ${{ matrix.target_repo }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          STALE_BASE_HEAL_STATE: company/stale-base-heal-state-${{ matrix.repo_label }}.json
        run: |
          set -euo pipefail
          args=()
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          python company/scripts/stale-base-heal/run.py "${args[@]}"

      - name: Commit state
        if: ${{ (github.event.inputs.dry_run || 'false') != 'true' }}
        env:
          STATE_FILES: >-
            company/conflict-heal-state-${{ matrix.repo_label }}.json
            company/check-rearm-state-${{ matrix.repo_label }}.json
            company/stale-base-heal-state-${{ matrix.repo_label }}.json
        run: |
          set -euo pipefail

          for f in $STATE_FILES; do
            if ! cat "$f" | bash company/scripts/sanitise.sh > /dev/null; then
              echo "::error::sanitise.sh rejected $f"
              exit 1
            fi
          done

          git config user.name "pupabobas[bot]"
          git config user.email "pupabobas[bot]@users.noreply.github.com"
          git add $STATE_FILES
          git diff --cached --quiet && echo "No state changes to commit" && exit 0

          today=$(date -u '+%Y-%m-%d')
          branch="conflict-heal/${{ matrix.repo_label }}-${today}-${GITHUB_RUN_ID}"
          git checkout -b "$branch" origin/main
          git add $STATE_FILES
          git commit -m "chore(merge-lane-heal): update ${{ matrix.repo_label }} state $today"
          git push -u origin "$branch"

          pr_url=$(gh pr create \
            --repo "${{ github.repository }}" \
            --title "chore(merge-lane-heal): update ${{ matrix.repo_label }} state $today" \
            --body "Automated conflict-heal + check-rearm + stale-base-heal retry-tracker update." \
            --base main \
            --head "$branch")
          echo "Opened state PR: $pr_url"
