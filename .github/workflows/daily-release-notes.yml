name: Daily Release Notes

# Daily plain-English digest of what shipped (merged PRs in the window),
# LLM-summarized, emailed to the team. Graceful when unconfigured: a missing
# email secret logs + skips the send (the digest still prints to the run log)
# rather than hard-failing — set the secrets to turn email on.
#
# Sends through the self-hosted Unsend instance (https://unsend.admin.lt) —
# dogfooding our own transactional-email product.
#
# Required repo secrets:
#   OPENROUTER_API_KEY   - already present; used for the LLM summary.
#   UNSEND_API_KEY       - Unsend API token (generate in the Unsend dashboard).
#   RELEASE_NOTES_FROM   - verified Unsend sender, e.g. notes@admin.lt
#   RELEASE_NOTES_TO     - comma-separated recipients (you + lempa).
#   UNSEND_URL           - (optional) Unsend base URL; defaults to the instance.

on:
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC daily
  workflow_dispatch:
    inputs:
      since_hours:
        description: "Look back window (hours)"
        default: "24"
      dry_run:
        description: "true = assemble + log, do NOT send"
        default: "false"

permissions:
  contents: read
  pull-requests: read

jobs:
  release-notes:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.WGMESH_BOT_PAT || secrets.GITHUB_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      UNSEND_API_KEY: ${{ secrets.UNSEND_API_KEY }}
      UNSEND_URL: ${{ secrets.UNSEND_URL || 'https://unsend.admin.lt' }}
      RELEASE_NOTES_FROM: ${{ secrets.RELEASE_NOTES_FROM }}
      RELEASE_NOTES_TO: ${{ secrets.RELEASE_NOTES_TO }}
      SINCE_HOURS: ${{ github.event.inputs.since_hours || '24' }}
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
      DIGEST_REPOS: ${{ secrets.DIGEST_REPOS }}
      DIGEST_EXCLUDE: ${{ vars.DIGEST_EXCLUDE || '.github,homebrew-tap' }}
      OPENPANEL_CLIENT_ID: ${{ secrets.OPENPANEL_CLIENT_ID }}
      OPENPANEL_CLIENT_SECRET: ${{ secrets.OPENPANEL_CLIENT_SECRET }}
      OPENPANEL_BASE: ${{ vars.OPENPANEL_BASE || 'https://counter.hackrsvalv.com/api' }}
      FUNNEL_DOMAIN: ${{ vars.FUNNEL_DOMAIN || 'polar.sh' }}
      FUNNEL_STAT_TEXT: ${{ vars.FUNNEL_STAT_TEXT }}
      ORG: ${{ github.repository_owner }}
    steps:
      - name: Collect merged PRs in the window
        run: |
          set -euo pipefail
          since=$(date -u -d "${SINCE_HOURS} hours ago" '+%Y-%m-%dT%H:%M:%SZ')
          echo "window since: $since"

          if [ -n "${DIGEST_REPOS:-}" ]; then
            printf '%s' "$DIGEST_REPOS" | tr ',' '\n' | while IFS= read -r raw || [ -n "$raw" ]; do
              name=$(printf '%s' "$raw" | xargs)
              [ -z "$name" ] && continue
              case "$name" in
                */*) printf '%s\n' "$name" ;;
                *) printf '%s/%s\n' "$ORG" "$name" ;;
              esac
            done > /tmp/repo_list_raw.txt
          else
            if ! gh repo list "$ORG" --source --no-archived --limit 200 --json name --jq '.[].name' > /tmp/repo_names.txt; then
              echo "::error::repo enumeration failed for $ORG"
              exit 1
            fi
            awk -v org="$ORG" 'NF {print org "/" $0}' /tmp/repo_names.txt > /tmp/repo_list_raw.txt
          fi

          printf '%s' "${DIGEST_EXCLUDE:-}" | tr ',' '\n' | while IFS= read -r raw || [ -n "$raw" ]; do
            name=$(printf '%s' "$raw" | xargs)
            [ -n "$name" ] && printf '%s\n' "${name##*/}"
          done > /tmp/repo_exclude.txt

          while IFS= read -r repo; do
            [ -z "$repo" ] && continue
            bare="${repo##*/}"
            if grep -Fxq "$bare" /tmp/repo_exclude.txt; then
              continue
            fi
            printf '%s\n' "$repo"
          done < /tmp/repo_list_raw.txt > /tmp/repo_list.txt

          : > /tmp/pr_arrays.jsonl
          while IFS= read -r repo; do
            [ -z "$repo" ] && continue
            echo "collecting merged PRs for $repo"
            safe=$(printf '%s' "$repo" | tr '/:' '__')
            repo_prs="/tmp/prs_${safe}.json"
            if ! gh pr list --repo "$repo" --state merged \
              --search "merged:>=${since}" --limit 100 \
              --json number,title,author,mergedAt,url,labels \
              --jq 'map({number, title, author: .author.login, mergedAt,
                         labels: [.labels[].name], url, repo: "'"$repo"'"})' > "$repo_prs"; then
              echo "::warning::pr list failed for $repo"
              continue
            fi
            cat "$repo_prs" >> /tmp/pr_arrays.jsonl
            printf '\n' >> /tmp/pr_arrays.jsonl
          done < /tmp/repo_list.txt

          if [ -s /tmp/pr_arrays.jsonl ]; then
            jq -s 'add | sort_by(.mergedAt) | reverse' /tmp/pr_arrays.jsonl > /tmp/prs.json
          else
            echo '[]' > /tmp/prs.json
          fi

          count=$(jq 'length' /tmp/prs.json)
          echo "merged PRs in window: $count"
          echo "PR_COUNT=$count" >> "$GITHUB_ENV"

          repo_count=$(jq -r '[.[].repo] | unique | length' /tmp/prs.json)
          echo "repos with merged PRs in window: $repo_count"
          echo "REPO_COUNT=$repo_count" >> "$GITHUB_ENV"

          jq -r '
            . as $prs
            | (reduce $prs[] as $pr ([]; if index($pr.repo) then . else . + [$pr.repo] end)) as $repos
            | (reduce $prs[] as $pr ({}; .[$pr.repo] = ((.[$pr.repo] // []) + [$pr]))) as $groups
            | $repos[]
            | . as $repo
            | "### \($repo | split("/")[-1])",
              ($groups[$repo][] | "- #\(.number) \(.title) (@\(.author)) \(.url)"),
              ""
          ' \
            /tmp/prs.json > /tmp/pr_list.txt
          cat /tmp/pr_list.txt || true

      - name: Summarize with the LLM
        if: env.PR_COUNT != '0'
        run: |
          set -euo pipefail
          : "${OPENROUTER_API_KEY:?OPENROUTER_API_KEY missing — cannot summarize}"
          pr_list=$(cat /tmp/pr_list.txt)
          prs_json=$(cat /tmp/prs.json)
          # Build the request with jq so the PR text is safely JSON-encoded.
          jq -n --arg prs "$pr_list" --arg prs_json "$prs_json" '{
            model: "z-ai/glm-5.2",
            messages: [
              {role: "system", content: "You are formatting a release-notes digest for a small founding team. Input: a list of merged PRs (number, title, author, repo). Output STRICT JSON ONLY, no prose, no code fence, matching exactly:\n{\"subline\":\"<=8 words, e.g. AI Pipeline\",\"themes\":[{\"emoji\":\"<one emoji>\",\"title\":\"<short Title Case theme>\",\"category\":\"<growth|digest|evals|model|observability|housekeeping|other>\",\"accent\":\"<hex like #16a34a>\",\"badge\":\"<UPGRADED|NEW|null>\",\"bullets\":[{\"text\":\"<plain sentence, no markdown>\",\"prs\":[<pr numbers>]}]}],\"footer\":\"<one upbeat sentence>\"}\nRules: group the PRs into 3-6 themes by what they accomplish (NOT by repo). Lead with customer/product-facing themes; put ALL routine bot work (heal/health-check/supervisor-rank/daily-assessment/audit) into ONE final theme titled Routine Automated Housekeeping with emoji 📋 and a single bullet summarizing it (you may omit its PR numbers or list a few). Also tag each theme with the single closest category from: growth (customer/landing/marketing/revenue), digest (release-notes/email/reporting), evals (testing/langfuse/judges/quality), model (LLM/executor/routing/model-config), observability (control-loop/telemetry/monitoring/health visibility), housekeeping (routine bot work — heal/supervisor-rank/daily-assessment/audit), other (anything else). The routine housekeeping theme MUST use category housekeeping. Pick a distinct accent hex per theme from this palette in order: #7c3aed,#16a34a,#2563eb,#4f46e5,#ea580c,#64748b. badge only for notable upgrades/new features else null. Every non-housekeeping bullet should cite its PR number(s) in prs. Keep titles/bullets short."},
              {role: "user", content: ("Merged pull requests today:\n\n" + $prs + "\n\nStructured PR JSON:\n" + $prs_json)}
            ]
          }' > /tmp/llm_req.json
          http=$(curl -s -w '%{http_code}' -o /tmp/llm_resp.json \
            -H "Authorization: Bearer $OPENROUTER_API_KEY" \
            -H "Content-Type: application/json" \
            -d @/tmp/llm_req.json \
            https://openrouter.ai/api/v1/chat/completions)
          if [ "$http" != "200" ]; then
            echo "::warning::LLM summary failed (HTTP $http); falling back to PR list only"
            echo "THEMED=0" >> "$GITHUB_ENV"
            echo "Here is what merged today:" > /tmp/summary.txt
          else
            jq -r '.choices[0].message.content // "Here is what merged today:"' \
              /tmp/llm_resp.json > /tmp/llm_raw.txt
            sed -e '1s/^```json[[:space:]]*$//' \
              -e '1s/^```[[:space:]]*$//' \
              -e '$s/^```[[:space:]]*$//' \
              /tmp/llm_raw.txt > /tmp/llm.json
            if jq -e '.themes and (.themes|type=="array") and (.themes|length>0)' /tmp/llm.json > /dev/null; then
              echo "THEMED=1" >> "$GITHUB_ENV"
              jq -r '
                (.themes // [])[]
                | (.title // "Updates") as $title
                | ($title + ":"),
                  ((.bullets // [])[] | "- " + (.text // ""))
              ' /tmp/llm.json > /tmp/summary.txt
            else
              echo "::warning::LLM themed JSON invalid; falling back to PR list only"
              echo "THEMED=0" >> "$GITHUB_ENV"
              cp /tmp/llm_raw.txt /tmp/summary.txt
              if [ ! -s /tmp/summary.txt ]; then
                echo "Here is what merged today:" > /tmp/summary.txt
              fi
            fi
          fi
          cat /tmp/summary.txt

      - name: Funnel stat (OpenPanel, best-effort)
        run: |
          set -uo pipefail
          if [[ -z "${OPENPANEL_CLIENT_ID:-}" || -z "${OPENPANEL_CLIENT_SECRET:-}" ]]; then
            echo "::notice::OPENPANEL_CLIENT_ID or OPENPANEL_CLIENT_SECRET not set — keeping static FUNNEL_STAT_TEXT"
            exit 0
          fi
          start=$(date -u -d "${SINCE_HOURS} hours ago" '+%Y-%m-%dT%H:%M:%S.000Z')
          end=$(date -u '+%Y-%m-%dT%H:%M:%S.000Z')
          url="${OPENPANEL_BASE%/}/export/events?event=link_out&includes=properties&start=${start}&end=${end}&limit=1000"
          http=$(curl -s -m 25 -o /tmp/funnel.json -w '%{http_code}' \
            -H "openpanel-client-id: ${OPENPANEL_CLIENT_ID}" \
            -H "openpanel-client-secret: ${OPENPANEL_CLIENT_SECRET}" \
            -H "User-Agent: Mozilla/5.0" \
            "$url")
          if [[ "$http" != "200" ]]; then
            echo "::warning::OpenPanel fetch HTTP $http — keeping static funnel text"
            exit 0
          fi
          export FUNNEL_DOMAIN
          polar=$(jq -r --arg d "$FUNNEL_DOMAIN" '[.data[] | select((.properties.href // "") | test($d))] | length' /tmp/funnel.json 2>/dev/null || echo "")
          total=$(jq -r '.data | length' /tmp/funnel.json 2>/dev/null || echo "")
          if [[ -z "$polar" || ! "$polar" =~ ^[0-9]+$ ]]; then
            echo "::warning::Could not parse polar click count from OpenPanel response — keeping static funnel text"
            exit 0
          fi
          stat="Polar CTA · ${polar} click(s) · ${total} outbound links · last ${SINCE_HOURS}h"
          echo "FUNNEL_STAT_TEXT=${stat}" >> "$GITHUB_ENV"
          echo "funnel: $stat"

      - name: Assemble + send email
        run: |
          set -euo pipefail
          today=$(date -u '+%Y-%m-%d')
          if [ "${PR_COUNT}" = "0" ]; then
            body=$(printf 'No pull requests merged in the last %s hours.\n' "$SINCE_HOURS")
          elif [ "${THEMED:-0}" = "1" ]; then
            python3 - <<'PY' > /tmp/summary_text.txt
          import json

          with open("/tmp/llm.json", encoding="utf-8") as fh:
              data = json.load(fh)

          for theme in data.get("themes", []):
              title = theme.get("title") or "Updates"
              print(f"{title}:")
              for bullet in theme.get("bullets", []):
                  text = bullet.get("text") or ""
                  prs = bullet.get("prs") or []
                  suffix = ""
                  if prs:
                      suffix = " " + " ".join(f"(#{pr})" for pr in prs)
                  print(f"- {text}{suffix}")
              print()
          PY
            body=$(printf '%s\n\n— Merged PRs —\n%s\n' \
              "$(cat /tmp/summary_text.txt)" "$(cat /tmp/pr_list.txt)")
          else
            body=$(printf '%s\n\n— Merged PRs —\n%s\n' \
              "$(cat /tmp/summary.txt)" "$(cat /tmp/pr_list.txt)")
          fi
          subject="${ORG} — what shipped ${today} (${PR_COUNT} PRs · ${REPO_COUNT} repos)"
          printf '%s\n' "$body" > /tmp/email_body.txt

          html_escape() {
            python3 -c 'import html, sys; print(html.escape(sys.stdin.read(), quote=True), end="")'
          }

          today_html=$(printf '%s' "$today" | html_escape)
          subline="AI Pipeline"
          footer_text="Steady progress on the pipeline."
          if [ "${THEMED:-0}" = "1" ]; then
            subline=$(jq -r '.subline // "AI Pipeline"' /tmp/llm.json)
            footer_text=$(jq -r '.footer // "Steady progress on the pipeline."' /tmp/llm.json)
          fi
          subline_html=$(printf '%s' "$subline" | html_escape)
          pr_count_html=$(printf '%s' "$PR_COUNT" | html_escape)
          repo_count_html=$(printf '%s' "$REPO_COUNT" | html_escape)
          since_hours_html=$(printf '%s' "$SINCE_HOURS" | html_escape)
          footer_html=$(printf '%s' "$footer_text" | html_escape)
          funnel_stat_html=$(printf '%s' "${FUNNEL_STAT_TEXT:-}" | html_escape)

          {
            cat <<HTML
          <!doctype html>
          <html><body style="margin:0;padding:0;background:#eef0f6;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;"><tr><td align="center" style="padding:24px 0;"><table role="presentation" width="640" cellpadding="0" cellspacing="0" style="max-width:640px;background:#fff;border-radius:8px;overflow:hidden;">
            <tr><td><img src="https://assets.buttondown.email/images/056112d0-c65e-4108-bc49-a260cdccb80f.png" alt="wgmesh" width="640" style="display:block;width:100%;max-width:640px;height:auto;border:0;" /></td></tr>
            <tr><td style="background:#0a0e27;padding:28px 24px;">
              <span style="font-size:26px;font-weight:800;color:#fff;">🕸 wgmesh</span>
              <div style="font-size:22px;font-weight:800;color:#fff;margin-top:6px;">What shipped</div>
              <div style="color:#9aa4d6;font-size:13px;margin-top:4px;">${subline_html} · ${today_html} · ${pr_count_html} PRs · ${repo_count_html} repos</div>
            </td></tr>
          HTML

            if [ -n "${FUNNEL_STAT_TEXT:-}" ]; then
              cat <<HTML
            <tr><td style="background:#f5f3ff;padding:16px 24px;color:#312e81;font-size:14px;">📊 ${funnel_stat_html}</td></tr>
          HTML
            fi

            if [ "${PR_COUNT}" = "0" ]; then
              cat <<HTML
            <tr><td style="padding:24px;color:#666;font-size:15px;">No pull requests merged in the last ${since_hours_html} hours.</td></tr>
          HTML
            elif [ "${THEMED:-0}" = "1" ]; then
              python3 - <<'PY'
          import html
          import json
          import re
          with open("/tmp/llm.json", encoding="utf-8") as fh:
              digest = json.load(fh)
          with open("/tmp/prs.json", encoding="utf-8") as fh:
              prs = json.load(fh)

          pr_urls = {str(pr.get("number")): str(pr.get("url") or "") for pr in prs}
          accent_re = re.compile(r"^#[0-9a-fA-F]{6}$")
          CATEGORY_ICONS = {
              "growth": "https://assets.buttondown.email/images/e817eef6-da25-44e2-91b4-4f5041321ede.png",
              "digest": "https://assets.buttondown.email/images/ec20f2b7-9236-4ec5-b2f6-b230259f993a.png",
              "evals": "https://assets.buttondown.email/images/77637d74-4c2c-4783-83b7-ad75061b6d20.png",
              "model": "https://assets.buttondown.email/images/341919a1-b58a-42ef-a22e-9059d8f0508c.png",
              "observability": "https://assets.buttondown.email/images/1b7e7d17-7ee1-4291-86ad-5552f14c51c4.png",
              "housekeeping": "https://assets.buttondown.email/images/86fc25ff-a646-44d6-af8d-c0da607fd2b5.png",
          }

          def esc(value):
              return html.escape(str(value or ""), quote=True)

          def safe_accent(value):
              value = str(value or "")
              return value if accent_re.match(value) else "#64748b"

          for theme in digest.get("themes", []):
              accent = safe_accent(theme.get("accent"))
              emoji = esc(theme.get("emoji") or "")
              title = esc(theme.get("title") or "Updates")
              badge = theme.get("badge")
              icon_url = CATEGORY_ICONS.get(theme.get("category", ""))
              if icon_url:
                  heading_icon = f'<img src="{icon_url}" alt="{emoji}" width="48" height="48" style="vertical-align:middle;border:0;margin-right:10px;border-radius:8px;" />'
              else:
                  heading_icon = emoji + " "
              print('            <tr><td style="padding:14px 20px;background:#eef0f6;">')
              print('              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#fff;border-collapse:collapse;"><tr>')
              print(f'                <td style="border-left:4px solid {accent};padding:16px 20px;">')
              heading = f'{heading_icon}<span style="font-weight:700;font-size:16px;color:#111;vertical-align:middle;">{title}</span>'
              if badge is not None:
                  heading += f' <span style="background:{accent};color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;margin-left:8px;">{esc(badge)}</span>'
              print(f'                  <div style="margin:0 0 10px 0;">{heading}</div>')
              print('                  <table role="presentation" width="100%" cellpadding="0" cellspacing="0">')
              for bullet in theme.get("bullets", []):
                  text = esc(bullet.get("text") or "")
                  links = []
                  for pr in bullet.get("prs") or []:
                      num = str(pr)
                      label = f"(#{esc(num)})"
                      url = pr_urls.get(num)
                      if url:
                          links.append(f'<a href="{esc(url)}" style="color:{accent};text-decoration:none;font-weight:600;font-size:13px;">{label}</a>')
                      else:
                          links.append(f'<span style="color:#64748b;font-weight:600;font-size:13px;">{label}</span>')
                  suffix = " ".join(links)
                  if suffix:
                      suffix = " " + suffix
                  print(f'                    <tr><td style="padding:5px 0;color:#333;font-size:14px;line-height:1.45;">&bull; {text}{suffix}</td></tr>')
              print('                  </table>')
              print('                </td>')
              print('              </tr></table>')
              print('            </td></tr>')
          PY
            else
              cat <<HTML
            <tr><td style="padding:20px 24px 4px 24px;color:#1a1a1a;line-height:1.5;">
          HTML

              python3 - <<'PY' /tmp/summary.txt
          import html
          import re
          import sys

          path = sys.argv[1]
          with open(path, encoding="utf-8") as fh:
              lines = fh.read().splitlines()

          def fmt(text):
              # escape first (neutralises real HTML), then render the only
              # markdown markers the LLM emits: **bold** and *italic*.
              esc = html.escape(text, quote=True)
              esc = re.sub(r"\*\*(.+?)\*\*", r"<strong>\1</strong>", esc)
              esc = re.sub(r"(?<!\*)\*(?!\*)([^*]+?)\*(?!\*)", r"<em>\1</em>", esc)
              return esc

          print('  <div style="font-size:15px;">')
          paragraph = []
          in_list = False

          def flush_paragraph():
              global paragraph
              if paragraph:
                  body = "<br>".join(paragraph)
                  print(f"    <p style=\"margin:0 0 12px 0;\">{body}</p>")
                  paragraph = []

          for line in lines:
              if not line.strip():
                  flush_paragraph()
                  if in_list:
                      print("    </ul>")
                      in_list = False
                  continue

              if line.startswith("- "):
                  flush_paragraph()
                  if not in_list:
                      print('    <ul style="margin:0 0 12px 20px;padding:0;">')
                      in_list = True
                  item = fmt(line[2:].strip())
                  print(f'      <li style="margin:4px 0;">{item}</li>')
                  continue

              if in_list:
                  print("    </ul>")
                  in_list = False
              paragraph.append(fmt(line))

          flush_paragraph()
          if in_list:
              print("    </ul>")
          print("  </div>")
          PY

              jq -r '
                def h: @html;
                . as $prs
                | (reduce $prs[] as $pr ([]; if index($pr.repo) then . else . + [$pr.repo] end)) as $repos
                | (reduce $prs[] as $pr ({}; .[$pr.repo] = ((.[$pr.repo] // []) + [$pr]))) as $groups
                | $repos[]
                | . as $repo
                | "<div style=\"margin:18px 0;padding:16px;border:1px solid #ececec;border-radius:10px;background:#fafafa;\">",
                  "  <div style=\"font-weight:600;font-size:15px;margin-bottom:10px;\">📦 \(($repo | split("/")[-1]) | h)</div>",
                  ($groups[$repo][] |
                    "  <div style=\"margin:6px 0;font-size:14px;\"><a href=\"\((.url // "") | h)\" style=\"color:#2563eb;text-decoration:none;font-weight:600;\">#\((.number | tostring) | h)</a> &nbsp;\((.title // "Untitled") | h) <span style=\"color:#999;font-size:12px;\">@\((.author // "unknown") | h)</span></div>"
                  ),
                  "</div>"
              ' /tmp/prs.json

              cat <<HTML
            </td></tr>
          HTML
            fi

            cat <<HTML
            <tr><td style="background:#0a0e27;padding:20px 24px;color:#fff;font-size:14px;">
              🚀 <span style="font-weight:700;">${footer_html}</span>
              <div style="color:#9aa4d6;font-size:12px;margin-top:8px;">Generated by the wgmesh pipeline · ${today_html}</div>
            </td></tr>
          </table></td></tr></table></body></html>
          HTML
          } > /tmp/email_body.html

          echo "===== SUBJECT ====="; echo "$subject"
          echo "===== BODY ====="; cat /tmp/email_body.txt

          if [ "${DRY_RUN}" = "true" ]; then
            echo "===== HTML ====="
            cat /tmp/email_body.html
            echo "DRY_RUN=true — not sending."; exit 0
          fi
          if [ -z "${UNSEND_API_KEY}" ] || [ -z "${RELEASE_NOTES_FROM}" ] || [ -z "${RELEASE_NOTES_TO}" ]; then
            echo "::warning::email secrets unset (UNSEND_API_KEY / RELEASE_NOTES_FROM / RELEASE_NOTES_TO) — digest logged above, skipping send."
            exit 0
          fi
          # Unsend API: POST {UNSEND_URL}/api/v1/emails, Bearer auth, JSON body.
          # `to` is an array — split the comma-separated recipients.
          payload=$(jq -n \
            --arg from "$RELEASE_NOTES_FROM" \
            --arg to "$RELEASE_NOTES_TO" \
            --arg subject "$subject" \
            --rawfile text /tmp/email_body.txt \
            --rawfile html /tmp/email_body.html \
            '{from:$from, to:($to | split(",") | map(gsub("^\\s+|\\s+$";""))),
              subject:$subject, text:$text, html:$html}')
          http=$(curl -s -w '%{http_code}' -o /tmp/unsend_resp.json \
            -X POST "${UNSEND_URL%/}/api/v1/emails" \
            -H "Authorization: Bearer $UNSEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$payload")
          echo "Unsend HTTP $http"; cat /tmp/unsend_resp.json || true
          case "$http" in
            200|201|202) echo "sent to: $RELEASE_NOTES_TO" ;;
            *) echo "::error::email send failed (HTTP $http)"; exit 1 ;;
          esac
