name: Daily Release Notes

# Daily plain-English digest of what shipped (merged PRs in the window),
# LLM-summarized, emailed to the team. Graceful when unconfigured: a missing
# email secret logs + skips the send (the digest still prints to the run log)
# rather than hard-failing — set the secrets to turn email on.
#
# Sends through the self-hosted Unsend instance (https://unsend.admin.lt) —
# dogfooding our own transactional-email product.
#
# Required repo secrets:
#   OPENROUTER_API_KEY   - already present; used for the LLM summary.
#   UNSEND_API_KEY       - Unsend API token (generate in the Unsend dashboard).
#   RELEASE_NOTES_FROM   - verified Unsend sender, e.g. notes@admin.lt
#   RELEASE_NOTES_TO     - comma-separated recipients (you + lempa).
#   UNSEND_URL           - (optional) Unsend base URL; defaults to the instance.

on:
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC daily
  workflow_dispatch:
    inputs:
      since_hours:
        description: "Look back window (hours)"
        default: "24"
      dry_run:
        description: "true = assemble + log, do NOT send"
        default: "false"

permissions:
  contents: read
  pull-requests: read

jobs:
  release-notes:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.WGMESH_BOT_PAT || secrets.GITHUB_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      UNSEND_API_KEY: ${{ secrets.UNSEND_API_KEY }}
      UNSEND_URL: ${{ secrets.UNSEND_URL || 'https://unsend.admin.lt' }}
      RELEASE_NOTES_FROM: ${{ secrets.RELEASE_NOTES_FROM }}
      RELEASE_NOTES_TO: ${{ secrets.RELEASE_NOTES_TO }}
      SINCE_HOURS: ${{ github.event.inputs.since_hours || '24' }}
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
      DIGEST_REPOS: ${{ secrets.DIGEST_REPOS }}
      DIGEST_EXCLUDE: ${{ vars.DIGEST_EXCLUDE || '.github,homebrew-tap' }}
      ORG: ${{ github.repository_owner }}
    steps:
      - name: Collect merged PRs in the window
        run: |
          set -uo pipefail
          since=$(date -u -d "${SINCE_HOURS} hours ago" '+%Y-%m-%dT%H:%M:%SZ')
          echo "window since: $since"

          if [ -n "${DIGEST_REPOS:-}" ]; then
            printf '%s' "$DIGEST_REPOS" | tr ',' '\n' | while IFS= read -r raw || [ -n "$raw" ]; do
              name=$(printf '%s' "$raw" | xargs)
              [ -z "$name" ] && continue
              case "$name" in
                */*) printf '%s\n' "$name" ;;
                *) printf '%s/%s\n' "$ORG" "$name" ;;
              esac
            done > /tmp/repo_list_raw.txt
          else
            if ! gh repo list "$ORG" --source --no-archived --limit 200 --json name --jq '.[].name' > /tmp/repo_names.txt; then
              echo "::error::repo enumeration failed for $ORG"
              exit 1
            fi
            awk -v org="$ORG" 'NF {print org "/" $0}' /tmp/repo_names.txt > /tmp/repo_list_raw.txt
          fi

          printf '%s' "${DIGEST_EXCLUDE:-}" | tr ',' '\n' | while IFS= read -r raw || [ -n "$raw" ]; do
            name=$(printf '%s' "$raw" | xargs)
            [ -n "$name" ] && printf '%s\n' "${name##*/}"
          done > /tmp/repo_exclude.txt

          while IFS= read -r repo; do
            [ -z "$repo" ] && continue
            bare="${repo##*/}"
            if grep -Fxq "$bare" /tmp/repo_exclude.txt; then
              continue
            fi
            printf '%s\n' "$repo"
          done < /tmp/repo_list_raw.txt > /tmp/repo_list.txt

          : > /tmp/pr_arrays.jsonl
          while IFS= read -r repo; do
            [ -z "$repo" ] && continue
            echo "collecting merged PRs for $repo"
            safe=$(printf '%s' "$repo" | tr '/:' '__')
            repo_prs="/tmp/prs_${safe}.json"
            if ! gh pr list --repo "$repo" --state merged \
              --search "merged:>=${since}" --limit 100 \
              --json number,title,author,mergedAt,url,labels \
              --jq 'map({number, title, author: .author.login, mergedAt,
                         labels: [.labels[].name], url, repo: "'"$repo"'"})' > "$repo_prs"; then
              echo "::warning::pr list failed for $repo"
              continue
            fi
            cat "$repo_prs" >> /tmp/pr_arrays.jsonl
            printf '\n' >> /tmp/pr_arrays.jsonl
          done < /tmp/repo_list.txt

          if [ -s /tmp/pr_arrays.jsonl ]; then
            jq -s 'add | sort_by(.mergedAt) | reverse' /tmp/pr_arrays.jsonl > /tmp/prs.json
          else
            echo '[]' > /tmp/prs.json
          fi

          count=$(jq 'length' /tmp/prs.json)
          echo "merged PRs in window: $count"
          echo "PR_COUNT=$count" >> "$GITHUB_ENV"

          repo_count=$(jq -r '[.[].repo] | unique | length' /tmp/prs.json)
          echo "repos with merged PRs in window: $repo_count"
          echo "REPO_COUNT=$repo_count" >> "$GITHUB_ENV"

          jq -r '
            . as $prs
            | (reduce $prs[] as $pr ([]; if index($pr.repo) then . else . + [$pr.repo] end)) as $repos
            | (reduce $prs[] as $pr ({}; .[$pr.repo] = ((.[$pr.repo] // []) + [$pr]))) as $groups
            | $repos[]
            | . as $repo
            | "### \($repo | split("/")[-1])",
              ($groups[$repo][] | "- #\(.number) \(.title) (@\(.author)) \(.url)"),
              ""
          ' \
            /tmp/prs.json > /tmp/pr_list.txt
          cat /tmp/pr_list.txt || true

      - name: Summarize with the LLM
        if: env.PR_COUNT != '0'
        run: |
          set -euo pipefail
          : "${OPENROUTER_API_KEY:?OPENROUTER_API_KEY missing — cannot summarize}"
          pr_list=$(cat /tmp/pr_list.txt)
          # Build the request with jq so the PR text is safely JSON-encoded.
          jq -n --arg prs "$pr_list" '{
            model: "z-ai/glm-5.2",
            messages: [
              {role: "system", content: "You write a short daily release-notes email for a small founding team that ships across multiple repositories. Plain English. Group by repository. Lead with customer- and product-facing repos (e.g. wgmesh, chimney, cloudroof-eu, webmail) and keep pipeline/template/CI plumbing brief and last. For each group explain WHAT shipped and WHY it matters, most impactful first. If a repo shipped only internal/CI/housekeeping work, say so in one line rather than dressing it up. 6-14 sentences or tight bullets. No preamble, no signature."},
              {role: "user", content: ("Merged pull requests today:\n\n" + $prs)}
            ]
          }' > /tmp/llm_req.json
          http=$(curl -s -w '%{http_code}' -o /tmp/llm_resp.json \
            -H "Authorization: Bearer $OPENROUTER_API_KEY" \
            -H "Content-Type: application/json" \
            -d @/tmp/llm_req.json \
            https://openrouter.ai/api/v1/chat/completions)
          if [ "$http" != "200" ]; then
            echo "::warning::LLM summary failed (HTTP $http); falling back to PR list only"
            echo "Here is what merged today:" > /tmp/summary.txt
          else
            jq -r '.choices[0].message.content // "Here is what merged today:"' \
              /tmp/llm_resp.json > /tmp/summary.txt
          fi
          cat /tmp/summary.txt

      - name: Assemble + send email
        run: |
          set -euo pipefail
          today=$(date -u '+%Y-%m-%d')
          if [ "${PR_COUNT}" = "0" ]; then
            body=$(printf 'No pull requests merged in the last %s hours.\n' "$SINCE_HOURS")
          else
            body=$(printf '%s\n\n— Merged PRs —\n%s\n' \
              "$(cat /tmp/summary.txt)" "$(cat /tmp/pr_list.txt)")
          fi
          subject="${ORG} — what shipped ${today} (${PR_COUNT} PRs · ${REPO_COUNT} repos)"
          printf '%s\n' "$body" > /tmp/email_body.txt

          html_escape() {
            python3 -c 'import html, sys; print(html.escape(sys.stdin.read(), quote=True), end="")'
          }

          org_html=$(printf '%s' "$ORG" | html_escape)
          today_html=$(printf '%s' "$today" | html_escape)
          count_line_html=$(printf '%s PRs · %s repos · last %sh' "$PR_COUNT" "$REPO_COUNT" "$SINCE_HOURS" | html_escape)
          since_hours_html=$(printf '%s' "$SINCE_HOURS" | html_escape)

          {
            cat <<HTML
          <!doctype html>
          <html>
          <body style="margin:0;padding:0;background:#ffffff;">
          <div style="max-width:640px;margin:0 auto;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1a1a1a;line-height:1.5;padding:24px;">
            <div style="border-bottom:1px solid #eee;padding-bottom:16px;margin-bottom:20px;">
              <div style="font-size:22px;font-weight:700;">${org_html}</div>
              <div style="color:#666;font-size:13px;">${today_html} · ${count_line_html}</div>
            </div>
          HTML

            if [ "${PR_COUNT}" = "0" ]; then
              cat <<HTML
            <p style="color:#666;">No pull requests merged in the last ${since_hours_html} hours.</p>
          HTML
            else
              python3 - <<'PY' /tmp/summary.txt
          import html
          import re
          import sys

          path = sys.argv[1]
          with open(path, encoding="utf-8") as fh:
              lines = fh.read().splitlines()

          def fmt(text):
              # escape first (neutralises real HTML), then render the only
              # markdown markers the LLM emits: **bold** and *italic*.
              esc = html.escape(text, quote=True)
              esc = re.sub(r"\*\*(.+?)\*\*", r"<strong>\1</strong>", esc)
              esc = re.sub(r"(?<!\*)\*(?!\*)([^*]+?)\*(?!\*)", r"<em>\1</em>", esc)
              return esc

          print('  <div style="font-size:15px;">')
          paragraph = []
          in_list = False

          def flush_paragraph():
              global paragraph
              if paragraph:
                  body = "<br>".join(paragraph)
                  print(f"    <p style=\"margin:0 0 12px 0;\">{body}</p>")
                  paragraph = []

          for line in lines:
              if not line.strip():
                  flush_paragraph()
                  if in_list:
                      print("    </ul>")
                      in_list = False
                  continue

              if line.startswith("- "):
                  flush_paragraph()
                  if not in_list:
                      print('    <ul style="margin:0 0 12px 20px;padding:0;">')
                      in_list = True
                  item = fmt(line[2:].strip())
                  print(f'      <li style="margin:4px 0;">{item}</li>')
                  continue

              if in_list:
                  print("    </ul>")
                  in_list = False
              paragraph.append(fmt(line))

          flush_paragraph()
          if in_list:
              print("    </ul>")
          print("  </div>")
          PY

              jq -r '
                def h: @html;
                . as $prs
                | (reduce $prs[] as $pr ([]; if index($pr.repo) then . else . + [$pr.repo] end)) as $repos
                | (reduce $prs[] as $pr ({}; .[$pr.repo] = ((.[$pr.repo] // []) + [$pr]))) as $groups
                | $repos[]
                | . as $repo
                | "<div style=\"margin:18px 0;padding:16px;border:1px solid #ececec;border-radius:10px;background:#fafafa;\">",
                  "  <div style=\"font-weight:600;font-size:15px;margin-bottom:10px;\">📦 \(($repo | split("/")[-1]) | h)</div>",
                  ($groups[$repo][] |
                    "  <div style=\"margin:6px 0;font-size:14px;\"><a href=\"\((.url // "") | h)\" style=\"color:#2563eb;text-decoration:none;font-weight:600;\">#\((.number | tostring) | h)</a> &nbsp;\((.title // "Untitled") | h) <span style=\"color:#999;font-size:12px;\">@\((.author // "unknown") | h)</span></div>"
                  ),
                  "</div>"
              ' /tmp/prs.json
            fi

            cat <<HTML
            <div style="margin-top:24px;padding-top:16px;border-top:1px solid #eee;color:#999;font-size:12px;">Generated by the wgmesh pipeline · ${today_html}</div>
          </div>
          </body>
          </html>
          HTML
          } > /tmp/email_body.html

          echo "===== SUBJECT ====="; echo "$subject"
          echo "===== BODY ====="; cat /tmp/email_body.txt

          if [ "${DRY_RUN}" = "true" ]; then
            echo "===== HTML ====="
            cat /tmp/email_body.html
            echo "DRY_RUN=true — not sending."; exit 0
          fi
          if [ -z "${UNSEND_API_KEY}" ] || [ -z "${RELEASE_NOTES_FROM}" ] || [ -z "${RELEASE_NOTES_TO}" ]; then
            echo "::warning::email secrets unset (UNSEND_API_KEY / RELEASE_NOTES_FROM / RELEASE_NOTES_TO) — digest logged above, skipping send."
            exit 0
          fi
          # Unsend API: POST {UNSEND_URL}/api/v1/emails, Bearer auth, JSON body.
          # `to` is an array — split the comma-separated recipients.
          payload=$(jq -n \
            --arg from "$RELEASE_NOTES_FROM" \
            --arg to "$RELEASE_NOTES_TO" \
            --arg subject "$subject" \
            --rawfile text /tmp/email_body.txt \
            --rawfile html /tmp/email_body.html \
            '{from:$from, to:($to | split(",") | map(gsub("^\\s+|\\s+$";""))),
              subject:$subject, text:$text, html:$html}')
          http=$(curl -s -w '%{http_code}' -o /tmp/unsend_resp.json \
            -X POST "${UNSEND_URL%/}/api/v1/emails" \
            -H "Authorization: Bearer $UNSEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$payload")
          echo "Unsend HTTP $http"; cat /tmp/unsend_resp.json || true
          case "$http" in
            200|201|202) echo "sent to: $RELEASE_NOTES_TO" ;;
            *) echo "::error::email send failed (HTTP $http)"; exit 1 ;;
          esac
