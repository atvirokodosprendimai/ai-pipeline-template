name: Observation Loop

on:
  schedule:
    - cron: '0 0,8,16 * * *'  # every 8 hours: 00:00, 08:00, 16:00 UTC
  workflow_dispatch:       # manual trigger
  repository_dispatch:     # webhook events (payment, alert, etc.)
    types: [company-signal]

permissions:
  contents: write
  issues: write
  pull-requests: read
  actions: read

concurrency:
  group: observation-loop
  cancel-in-progress: false

jobs:
  loop:
    name: Observe → Assess → Act
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.PUSH_TOKEN }}
          fetch-depth: 0

      # ── Collect state ──────────────────────────────────────────

      - name: Collect GitHub signals (all repos)
        env:
          GITHUB_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: |
          # Full collection (with fn:label counts) only for primary product repo.
          # Secondary repos get lightweight stats only (no search API calls).
          primary="atvirokodosprendimai/wgmesh"
          secondary=(
            atvirokodosprendimai/ai-pipeline-template
            atvirokodosprendimai/lighthouse
            atvirokodosprendimai/lighthouse-go
            atvirokodosprendimai/chimney
            atvirokodosprendimai/coroot-cicd
            atvirokodosprendimai/cloudroof-eu
            atvirokodosprendimai/dns-server
            atvirokodosprendimai/tvcentras
            atvirokodosprendimai/homebrew-tap
          )

          # Primary repo: full collection
          GITHUB_REPOSITORY="$primary" bash company/scripts/collect-github.sh > "/tmp/gh-primary.json" 2>&1 || {
            echo "::warning::Failed to collect signals from $primary"
            echo '{"error": "collection failed"}' > "/tmp/gh-primary.json"
          }
          jq --arg repo "$primary" '. + {repo: $repo}' "/tmp/gh-primary.json" > "/tmp/gh-primary-tagged.json"

          # Secondary repos: lightweight (repo info + recent PRs only, no search API)
          API="https://api.github.com"
          AUTH=(-H "Authorization: token $GITHUB_TOKEN")
          for repo in "${secondary[@]}"; do
            name="${repo##*/}"
            {
              info=$(curl -sf "${AUTH[@]}" -H "Accept: application/vnd.github+json" "$API/repos/$repo" 2>/dev/null || echo '{}')
              open_prs=$(curl -sf "${AUTH[@]}" -H "Accept: application/vnd.github+json" "$API/repos/$repo/pulls?state=open&per_page=5" 2>/dev/null | jq 'if type == "array" then length else 0 end' || echo "0")
              jq -n \
                --arg repo "$repo" \
                --arg collected_at "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
                --argjson stars "$(echo "$info" | jq '.stargazers_count // 0')" \
                --argjson forks "$(echo "$info" | jq '.forks_count // 0')" \
                --argjson open_issues "$(echo "$info" | jq '.open_issues_count // 0')" \
                --argjson open_prs "${open_prs:-0}" \
                '{repo: $repo, source: "github-lite", collected_at: $collected_at, stars: $stars, forks: $forks, open_issues_total: $open_issues, open_prs: $open_prs}'
            } > "/tmp/gh-${name}-tagged.json" 2>&1 || {
              echo "::warning::Failed to collect signals from $repo"
              jq -n --arg repo "$repo" '{repo: $repo, error: "collection failed"}' > "/tmp/gh-${name}-tagged.json"
            }
          done

          jq -s --arg ts "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" '{source: "github", collected_at: $ts, repos: .}' /tmp/gh-*-tagged.json > /tmp/github.json

      - name: Collect infrastructure signals
        run: bash company/scripts/collect-infra.sh > /tmp/infra.json

      - name: Collect contribution signals
        run: bash company/scripts/collect-contributions.sh > /tmp/contributions.json

      - name: Collect product codebase summary
        env:
          GITHUB_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: |
          # Fetch CLAUDE.md from primary product repo — gives the LLM awareness of
          # what actually exists in the codebase (architecture, packages, features).
          # Without this, the LLM can only see GitHub metadata (issue counts, PR velocity)
          # and may hallucinate that features don't exist.
          # See RCA: https://github.com/atvirokodosprendimai/wgmesh/issues/458
          primary="atvirokodosprendimai/wgmesh"
          claude_md=$(gh api "repos/$primary/contents/CLAUDE.md" --jq '.content' 2>/dev/null | base64 -d 2>/dev/null || echo "")

          if [ -n "$claude_md" ]; then
            # Extract Build/Test + Architecture sections (skip conventions, CI, etc.)
            echo "$claude_md" | sed -n '1,/^## Code Conventions/p' | head -n -1 > /tmp/product_summary.txt
          else
            echo "No CLAUDE.md found in $primary." > /tmp/product_summary.txt
          fi

      - name: Collect already-shipped capabilities
        env:
          GH_TOKEN: ${{ secrets.PUSH_TOKEN }}
          TARGET_REPO: atvirokodosprendimai/wgmesh
        run: |
          # Derive a digest of already-shipped capabilities from recent merged
          # implementation PRs + docs/solutions/, so the LLM stops re-proposing
          # shipped work (e.g. OpenPanel analytics #762 -> redundant #767).
          # Best-effort: never blocks the loop; writes a sentinel on failure.
          bash company/scripts/collect-capabilities.sh > /tmp/capabilities.txt || {
            echo "::warning::collect-capabilities.sh failed — proceeding without capabilities digest"
            echo "(capabilities digest unavailable this run)" > /tmp/capabilities.txt
          }

      - name: Collect shared memory
        run: |
          # Semantic memory (MEMORY.md) + recent episodic entries.
          # Budget: 4KB semantic + 2KB episodic = 6KB total.
          bash company/scripts/collect-memory.sh --budget 6144 --recent 5 > /tmp/shared_memory.txt 2>/dev/null || {
            echo "::warning::collect-memory.sh failed — proceeding without shared memory"
            echo "No shared memory available." > /tmp/shared_memory.txt
          }

      - name: Collect open issues and PRs
        env:
          GH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: |
          target="atvirokodosprendimai/wgmesh"
          # Secondary repos with potential open issues — lightweight scan for cross-repo dedup.
          secondary_repos="atvirokodosprendimai/chimney atvirokodosprendimai/lighthouse atvirokodosprendimai/tvcentras"

          {
            echo "## Open Issues (wgmesh)"
            echo ""
            gh issue list --repo "$target" --state open --limit 50 \
              --json number,title,labels \
              --jq '.[] | "- #\(.number) \(.title) [\([.labels[].name] | join(", "))]"' 2>/dev/null || echo "- (failed to fetch)"
            echo ""
            echo "## Open PRs (wgmesh)"
            echo ""
            gh pr list --repo "$target" --state open --limit 20 \
              --json number,title,author \
              --jq '.[] | "- PR #\(.number) \(.title) (by \(.author.login))"' 2>/dev/null || echo "- (failed to fetch)"

            # Include secondary repo issues so the LLM can detect cross-repo duplicates
            for repo in $secondary_repos; do
              name="${repo##*/}"
              issues=$(gh issue list --repo "$repo" --state open --limit 10 \
                --json number,title \
                --jq '.[] | "- #\(.number) \(.title)"' 2>/dev/null || true)
              if [ -n "$issues" ]; then
                echo ""
                echo "## Open Issues ($name)"
                echo ""
                echo "$issues"
              fi
            done
          } > /tmp/open_board.txt

      - name: Read recent assessments
        run: |
          {
            ls -t company/loop-history/*.md 2>/dev/null | head -3 | while read -r f; do
              echo "--- $(basename "$f") ---"
              cat "$f"
              echo ""
            done
          } > /tmp/history.txt 2>/dev/null || echo "No prior assessments." > /tmp/history.txt

      - name: Load commercial idle policy
        run: |
          if [ -f company/idle-policy.md ]; then
            cp company/idle-policy.md /tmp/idle_policy.txt
          else
            echo "No idle policy available." > /tmp/idle_policy.txt
          fi

      - name: Collect Polar revenue signals
        env:
          POLAR_TOKEN: ${{ secrets.POLAR_TOKEN }}
        run: |
          # Poll Polar.sh API for subscription/revenue data.
          #
          # Filters subscriptions to the seeded-product cohort (cloudroof tiers).
          # Earlier versions queried all subs in the org, which mixed in
          # unrelated products. The downstream assessment LLM then attributed
          # those org-level subs to the seeded product — wrong stage signal.
          # Background:
          #   docs/solutions/integration-issues/polar-checkout-404s-from-stale-config-2026-05-08.md
          # contains the discovery of these product UUIDs and the slug fix.
          # Schema-stability note: ALL paths (success + degraded) emit the
          # same field set including `note`; cents are integer, EUR fields
          # are NOT precomputed (LLM divides cents by 100 to render).
          NOTE_TEXT="SEED cohort = cloudroof tier products only. Use seed_product_* for stage progression. ALL-org may include unrelated products in the same Polar organization; do NOT attribute those to the seeded product."
          if [ -z "$POLAR_TOKEN" ]; then
            echo '::warning::POLAR_TOKEN not configured — revenue signals unavailable'
            jq -n --arg note "$NOTE_TEXT" '{
              source: "polar",
              error: "POLAR_TOKEN not configured",
              note: $note,
              seed_product_subscribers: 0,
              seed_product_mrr_cents: 0,
              seed_per_product: [],
              all_org_subscribers: 0,
              all_org_mrr_cents: 0,
              recent_orders: []
            }' > /tmp/polar.json
            exit 0
          fi

          POLAR_ORG="it-uoga-mb"
          API="https://api.polar.sh"

          # Cloudroof seeded-product cohort UUIDs. Source-of-truth doc is
          # in this repo at docs/solutions/integration-issues/polar-checkout-404s-from-stale-config-2026-05-08.md
          # which documents how these were discovered. If new tiers are added,
          # add the UUID below and to that doc.
          # Founding $5/mo, Edge Node $20/mo, Mesh Operator $100/mo.
          SEED_PRODUCT_IDS=(
            "3f5d75de-936b-49d8-a21b-4b79d9fd22c1"
            "1927e637-4cfd-4c94-8bee-c5518803bc89"
            "eb20683e-55ea-4354-9d8c-070e55a4eff5"
          )

          org_data=$(curl -sf \
            -H "Authorization: Bearer $POLAR_TOKEN" \
            -H "Accept: application/json" \
            "$API/v1/organizations/?slug=$POLAR_ORG" 2>/dev/null || echo '{"items":[]}')

          org_id=$(echo "$org_data" | jq -r '.items[0].id // empty')
          if [ -z "$org_id" ]; then
            echo '::warning::Could not resolve Polar organization ID'
            jq -n --arg note "$NOTE_TEXT" '{
              source: "polar",
              error: "org not found",
              note: $note,
              seed_product_subscribers: 0,
              seed_product_mrr_cents: 0,
              seed_per_product: [],
              all_org_subscribers: 0,
              all_org_mrr_cents: 0,
              recent_orders: []
            }' > /tmp/polar.json
            exit 0
          fi

          # Helper: paginate Polar /v1/subscriptions across all pages and
          # aggregate count + summed amount (in cents). Polar pagination
          # uses `page` (1-indexed) + `limit` query params and returns a
          # `pagination.total_count` + `pagination.max_page` envelope.
          # Stops early if a page returns no items (defensive).
          # Args:
          #   $1 = base subscriptions URL (organization_id and any product_id
          #        already in querystring; pagination params appended here)
          # Sets via stdout: "<count> <mrr_cents>" (space-separated).
          polar_paginate_subs() {
            local base_url="$1"
            local page=1
            local limit=100
            local total_count=0
            local total_mrr=0
            local seen=0
            local max_pages=50  # hard cap to prevent runaway loops on bad responses
            while [ "$page" -le "$max_pages" ]; do
              local resp
              resp=$(curl -sf \
                -H "Authorization: Bearer $POLAR_TOKEN" \
                -H "Accept: application/json" \
                "${base_url}&page=${page}&limit=${limit}" 2>/dev/null \
                || echo '{"items":[]}')
              local pcount pmrr
              pcount=$(echo "$resp" | jq '.items | length')
              pmrr=$(echo "$resp" | jq '[.items[].amount // 0] | add // 0')
              total_count=$((total_count + pcount))
              total_mrr=$((total_mrr + pmrr))
              seen=$((seen + pcount))
              # Stop if this page returned fewer than `limit` items — done.
              if [ "$pcount" -lt "$limit" ]; then
                break
              fi
              page=$((page + 1))
            done
            printf '%d %d\n' "$total_count" "$total_mrr"
          }

          # 1. Org-level subs (used for context only — must NOT be attributed
          # to the seeded product without product_id check). Paginated.
          read -r all_sub_count all_mrr_cents < <(
            polar_paginate_subs "$API/v1/subscriptions/?organization_id=$org_id&active=true"
          )

          # 2. Seed-product cohort: per-product, sum across cloudroof tiers only.
          # Canonical "is the seeded product getting paid customers?" signal.
          # Each product paginated independently.
          seed_subs_total=0
          seed_mrr_cents=0
          seed_per_product=()
          for pid in "${SEED_PRODUCT_IDS[@]}"; do
            local_count=0
            local_mrr=0
            read -r local_count local_mrr < <(
              polar_paginate_subs "$API/v1/subscriptions/?organization_id=$org_id&product_id=$pid&active=true"
            )
            seed_subs_total=$((seed_subs_total + local_count))
            seed_mrr_cents=$((seed_mrr_cents + local_mrr))
            seed_per_product+=("$(jq -n --arg id "$pid" --argjson c "$local_count" --argjson m "$local_mrr" '{product_id: $id, active_subscribers: $c, mrr_cents: $m}')")
          done

          # Recent orders. Org-level; downstream LLM must NOT attribute to
          # seed cohort without checking product_id on each order.
          orders=$(curl -sf \
            -H "Authorization: Bearer $POLAR_TOKEN" \
            -H "Accept: application/json" \
            "$API/v1/orders/?organization_id=$org_id&limit=10" 2>/dev/null \
            || echo '{"items":[]}')

          recent_orders=$(echo "$orders" | jq '[.items[] | {id: .id, amount_cents: .amount, status: .status, created_at: .created_at, product_id: .product_id}]')

          # Logging: aggregate phrasing only. Public-repo workflow logs are
          # publicly visible and company/system-prompt.md forbids exact
          # revenue figures in public assessments. Use bucket categories.
          if [ "$seed_subs_total" -eq 0 ]; then seed_bucket="pre-revenue"
          elif [ "$seed_subs_total" -le 5 ]; then seed_bucket="emerging"
          elif [ "$seed_subs_total" -le 50 ]; then seed_bucket="growing"
          else seed_bucket="scale"
          fi
          echo "Polar SEED-cohort (cloudroof) status=${seed_bucket}"
          echo "Polar ALL-org subs sampled (CONTEXT ONLY — includes unrelated products); exact figures in /tmp/polar.json (workflow-internal)"

          per_product_json=$(printf '%s\n' "${seed_per_product[@]}" | jq -s '.')

          jq -n \
            --arg note "$NOTE_TEXT" \
            --argjson seed_subs "$seed_subs_total" \
            --argjson seed_mrr_c "$seed_mrr_cents" \
            --argjson all_subs "$all_sub_count" \
            --argjson all_mrr_c "$all_mrr_cents" \
            --argjson per_product "$per_product_json" \
            --argjson orders "$recent_orders" \
            --arg collected_at "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
            '{
              source: "polar",
              collected_at: $collected_at,
              note: $note,
              seed_product_subscribers: $seed_subs,
              seed_product_mrr_cents: $seed_mrr_c,
              seed_per_product: $per_product,
              all_org_subscribers: $all_subs,
              all_org_mrr_cents: $all_mrr_c,
              recent_orders: $orders
            }' > /tmp/polar.json

      - name: Merge state snapshot (revenue bucketized for LLM)
        run: |
          # The LLM-visible snapshot bucketizes revenue figures rather than
          # passing through raw cents. company/system-prompt.md forbids
          # exact revenue in public-facing assessments; relying on prompt
          # discipline alone is fragile (PR #825 incident demonstrated the
          # LLM can render cents → "€0.04" in a public assessment despite
          # the prompt rule). Defense in depth: redact AT SOURCE.
          #
          # Buckets (subscriber-count thresholds):
          #   pre-revenue : 0 subs
          #   emerging    : 1–5 subs
          #   growing     : 6–50 subs
          #   scale       : 51+ subs
          # Workflow-internal /tmp/polar.json retains raw cents for audit
          # (workflow logs are public BUT polar.json itself is not artifact-
          # uploaded; only the bucketized snapshot is shown to the LLM).
          jq -n \
            --slurpfile github /tmp/github.json \
            --slurpfile infra /tmp/infra.json \
            --slurpfile contributions /tmp/contributions.json \
            --slurpfile loop_state company/loop-state.json \
            --slurpfile costs company/costs.json \
            --slurpfile polar /tmp/polar.json \
            --slurpfile pipeline_health company/pipeline-health-state.json \
            '
            def bucket(n):
              if n <= 0 then "pre-revenue"
              elif n <= 5 then "emerging"
              elif n <= 50 then "growing"
              else "scale" end;
            {
              github: $github[0],
              infrastructure: $infra[0],
              contributions: $contributions[0],
              loop_state: $loop_state[0],
              costs: $costs[0],
              revenue: (
                $polar[0] as $p
                | {
                    source: $p.source,
                    collected_at: $p.collected_at,
                    note: ($p.note // ""),
                    error: ($p.error // null),
                    seed_product_bucket: bucket($p.seed_product_subscribers // 0),
                    all_org_bucket: bucket($p.all_org_subscribers // 0),
                    seed_product_subscribers: $p.seed_product_subscribers,
                    all_org_subscribers: $p.all_org_subscribers,
                    seed_per_product_subscribers: [
                      ($p.seed_per_product // [])[]
                      | { product_id: .product_id, active_subscribers: .active_subscribers }
                    ],
                    recent_orders: [
                      ($p.recent_orders // [])[]
                      | { id: .id, status: .status, created_at: .created_at, product_id: .product_id }
                    ]
                  }
              ),
              pipeline_health: $pipeline_health[0]
            }' > /tmp/snapshot.json

      # ── Assess ─────────────────────────────────────────────────

      - name: Call LLM (or generate stub)
        env:
          OBSERVER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OBSERVER_API_KEY" ]; then
            echo "::warning::Observer API key not set — generating stub assessment."
            today=$(date -u '+%Y-%m-%d')
            cat > /tmp/assessment.json <<STUBEOF
          {
            "timestamp": "${today}T08:00:00Z",
            "funnel_stage": 0,
            "stage_name": "Foundation",
            "runway": {"monthly_burn_eur": null, "months_remaining": null, "survival_mode": false},
            "assessment": "Observer API key not configured. The loop infrastructure is deployed but cannot call the LLM yet. This is a needs-human blocker.",
            "blockers": ["Observer API key not set in GitHub secrets"],
            "top_actions": [{"rank": 1, "action": "Set observer API key in repo secrets", "function": "fn:ops", "leverage": "Unblocks the entire control loop", "cost": "cheap"}],
            "issues_to_create": [],
            "issues_to_close": [],
            "contributions": [],
            "reciprocation_proposals": [],
            "needs_human": [{"request": "Add observer API key to repository secrets", "reason": "Loop cannot function without LLM access", "urgency": "blocking"}]
          }
          STUBEOF
          else
            # Build user message with state snapshot
            cat > /tmp/user_message.txt <<MSGEOF
          Here is the current state snapshot for your assessment:

          ## State Snapshot
          $(cat /tmp/snapshot.json)

          ## Product Codebase Summary
          This is the actual state of the primary product repo (from CLAUDE.md). Use this to
          understand what features ALREADY EXIST. Do NOT create issues for features listed here.
          $(cat /tmp/product_summary.txt)

          ## Already-Shipped Capabilities
          Capabilities already shipped via merged PRs (and documented solutions),
          newest first. Treat every item here as DONE — do NOT create issues to
          build, add, or re-implement anything already listed, even when it is
          worded differently from the capability name. Reconcile any open issue
          that duplicates one of these to closure.
          $(cat /tmp/capabilities.txt)

          ## Shared Memory
          Curated knowledge and recent agent activity from the shared memory subsystem.
          Use this to maintain continuity across runs and avoid repeating past mistakes.
          $(cat /tmp/shared_memory.txt)

          ## Open Issues & PRs
          Review this list every run. Close issues and PRs that are stale, superseded, or
          describe features that already exist (check the Product Codebase Summary).
          $(cat /tmp/open_board.txt)

          ## Recent Assessment History
          $(cat /tmp/history.txt)

          ## Commercial Idle Policy
          Use this policy to decide the highest-leverage 2–4 hour action when the pipeline is idle or nearly idle.
          $(cat /tmp/idle_policy.txt)

          ## Additional instruction
          If the pipeline is healthy or mostly idle (for example: low open PR count, no stale work, no active healing needed), bias your top action selection toward the single highest-leverage 2–4 hour task described by the Commercial Idle Policy.

          Please provide your assessment as a JSON object per the output format in your system prompt.
          MSGEOF

            # Call LLM via OpenAI-compatible API
            jq -n \
              --rawfile system company/system-prompt.md \
              --rawfile user /tmp/user_message.txt \
              '{
                model: "anthropic/claude-sonnet-4",
                max_tokens: 4096,
                messages: [{role: "system", content: $system}, {role: "user", content: $user}]
              }' > /tmp/request.json

            # NOTE: Expects OpenAI-compatible chat/completions endpoint.
            # Use OpenRouter or similar proxy for non-OpenAI providers.
            http_code=$(curl -s -w '%{http_code}' -o /tmp/llm_response.json \
              -H "Authorization: Bearer $OBSERVER_API_KEY" \
              -H "content-type: application/json" \
              -d @/tmp/request.json \
              https://openrouter.ai/api/v1/chat/completions)

            if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
              content=$(jq -r '.choices[0].message.content' /tmp/llm_response.json)
              echo "$content" | sed -n '/^```json/,/^```$/p' | sed '1d;$d' > /tmp/assessment.json
              if [ ! -s /tmp/assessment.json ]; then
                echo "$content" | jq . > /tmp/assessment.json 2>/dev/null || echo "$content" > /tmp/assessment.json
              fi
            else
              api_error=$(jq -r '.error.message // "unknown error"' /tmp/llm_response.json 2>/dev/null || echo "HTTP $http_code")
              echo "::warning::Observer LLM returned HTTP $http_code: $api_error — falling back to stub."
              today=$(date -u '+%Y-%m-%d')
              jq -n --arg ts "${today}T08:00:00Z" --arg err "$api_error" '{
                timestamp: $ts, funnel_stage: 0, stage_name: "Foundation",
                runway: {monthly_burn_eur: null, months_remaining: null, survival_mode: false},
                assessment: ("LLM call failed: " + $err + ". Falling back to stub assessment."),
                blockers: [("Observer API error: " + $err)],
                top_actions: [{rank: 1, action: "Fix observer API access", function: "fn:ops", leverage: "Unblocks LLM assessments", cost: "cheap"}],
                issues_to_create: [], issues_to_close: [], contributions: [], reciprocation_proposals: [],
                needs_human: [{request: "Fix observer API access", reason: $err, urgency: "blocking"}]
              }' > /tmp/assessment.json
            fi
          fi

      - name: Generate markdown assessment
        run: |
          today=$(date -u '+%Y-%m-%d')
          stage=$(jq -r '.stage_name // "Unknown"' /tmp/assessment.json)
          narrative=$(jq -r '.assessment // "No assessment available."' /tmp/assessment.json)
          blockers=$(jq -r '(.blockers // []) | map("- " + .) | join("\n")' /tmp/assessment.json)
          actions=$(jq -r '(.top_actions // []) | map("- **" + (.function // "?") + "**: " + (.action // "?") + " (" + (.cost // "?") + ")") | join("\n")' /tmp/assessment.json)
          contribs=$(jq -r '(.contributions // []) | map("- **" + .entity + "**: " + .detail) | join("\n")' /tmp/assessment.json)
          human=$(jq -r '(.needs_human // []) | map("- [" + .urgency + "] " + .request) | join("\n")' /tmp/assessment.json)

          # Compute new run count once — used by all subsequent steps
          prev_count=$(jq -r '.run_count // 0' company/loop-state.json)
          new_count=$((prev_count + 1))
          echo "$new_count" > /tmp/run-count.txt

          cat > /tmp/assessment.md <<MDEOF
          # Assessment: $today

          **Stage**: $stage | **Run**: $new_count

          $narrative

          ## Blockers
          $blockers

          ## Top Actions
          $actions

          ## Contributions
          ${contribs:-_None recorded this cycle._}

          ## Needs Human
          ${human:-_Nothing this cycle._}
          MDEOF

      # ── Act ────────────────────────────────────────────────────

      - name: Save assessment to loop history
        run: |
          today=$(date -u '+%Y%m%d')
          cp /tmp/assessment.md "company/loop-history/${today}-assessment.md"

      - name: Update loop state
        run: |
          today=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          stage=$(jq -r '.funnel_stage // 0' /tmp/assessment.json)
          stage_name=$(jq -r '.stage_name // "Foundation"' /tmp/assessment.json)
          new_count=$(cat /tmp/run-count.txt)

          jq --arg ts "$today" \
             --argjson stage "$stage" \
             --arg name "$stage_name" \
             --argjson count "$new_count" \
             '.last_run = $ts | .funnel_stage = $stage | .stage_name = $name | .run_count = $count' \
             company/loop-state.json > /tmp/new-state.json
          mv /tmp/new-state.json company/loop-state.json

      - name: Append assessment to MentisDB
        continue-on-error: true
        timeout-minutes: 1
        env:
          MENTISDB_URL: ${{ secrets.MENTISDB_URL }}
          MENTISDB_USER: ${{ secrets.MENTISDB_USER }}
          MENTISDB_PASSWORD: ${{ secrets.MENTISDB_PASSWORD }}
        run: |
          set -euo pipefail

          stage=$(jq -r '.stage_name // "Unknown"' /tmp/assessment.json)
          summary=$(jq -r '.assessment // "No assessment."' /tmp/assessment.json)
          blockers=$(jq -r '(.blockers // []) | join("; ")' /tmp/assessment.json)
          actions=$(jq -r '(.top_actions // []) | map(.action) | join("; ")' /tmp/assessment.json)
          issues_created=$(jq -r '(.issues_to_create // []) | map(.title) | join("; ")' /tmp/assessment.json)
          issues_closed=$(jq -r '(.issues_to_close // []) | map(.number | tostring) | join(", ")' /tmp/assessment.json)
          run_count=$(cat /tmp/run-count.txt)
          lower_stage=$(printf '%s' "$stage" | tr '[:upper:]' '[:lower:]')

          decisions=$(cat <<EOF
          - Top actions: ${actions:-none}
          - Issues created: ${issues_created:-none}
          - Issues closed: ${issues_closed:-none}
          EOF
          )

          learnings=$(cat <<EOF
          - Blockers: ${blockers:-none identified}
          EOF
          )

          BODY=$(cat <<EOF
          ## Summary
          Run #${run_count}, stage: ${stage}.
          ${summary}

          ## Key Decisions
          ${decisions}

          ## Learnings
          ${learnings}
          EOF
          )

          # Sanitise content before persisting — same gate the markdown writes used.
          if ! SANITISED_BODY=$(printf '%s' "$BODY" | bash company/scripts/sanitise.sh); then
            echo "::error::sanitise.sh rejected the assessment body — refusing to POST to MentisDB"
            exit 1
          fi
          if [ -z "$SANITISED_BODY" ]; then
            echo "::error::sanitise.sh rejected the assessment body — refusing to POST to MentisDB"
            exit 1
          fi

          PAYLOAD=$(jq -n \
            --arg content "$SANITISED_BODY" \
            --arg stage "$lower_stage" \
            --arg run "$run_count" \
            '{
              chain_key: "ai-pipeline-template",
              agent_id: "observation-loop",
              agent_name: "observation-loop",
              thought_type: "Insight",
              content: $content,
              tags: ["observation-loop", "assessment", $stage, ("run-" + $run)],
              importance: 0.4
            }')

          URL="${MENTISDB_URL%/}/v1/thoughts"
          curl --fail-with-body --silent --show-error --max-time 15 \
            -u "$MENTISDB_USER:$MENTISDB_PASSWORD" \
            -X POST -H 'Content-Type: application/json' \
            -d "$PAYLOAD" "$URL"

      - name: Sanitise before commit
        run: |
          for f in company/loop-history/*.md; do
            [ -f "$f" ] && cat "$f" | bash company/scripts/sanitise.sh > /dev/null || true
          done
          cat company/loop-state.json | bash company/scripts/sanitise.sh > /dev/null

      - name: Commit state
        env:
          GH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: |
          git config user.name "observation-loop[bot]"
          git config user.email "observation-loop[bot]@users.noreply.github.com"
          git add company/loop-state.json company/loop-history/
          git diff --cached --quiet && echo "No changes to commit" && exit 0

          today=$(date -u '+%Y-%m-%d')
          branch="loop/assessment-${today}-${GITHUB_RUN_ID}"
          git checkout -b "$branch" origin/main
          git commit -m "loop: daily assessment $today"
          git push -u origin "$branch"

          pr_url=$(gh pr create \
            --title "loop: daily assessment $today" \
            --body "Automated assessment from observation loop." \
            --base main \
            --head "$branch")

          pr_number=$(echo "$pr_url" | grep -o '[0-9]*$')
          echo "Created PR #${pr_number}"

          # Review-merge handled by bot-pr-review-merge.yml workflow

      - name: Create issues from assessment
        env:
          GH_TOKEN: ${{ secrets.PUSH_TOKEN }}
          TARGET_REPO: atvirokodosprendimai/wgmesh
        run: |
          # Fetch open AND recently closed issue titles for dedup.
          # Checking only open issues misses features that were already implemented
          # and closed — causing the LLM to re-create them as greenfield tasks.
          # See RCA: https://github.com/atvirokodosprendimai/wgmesh/issues/458
          gh issue list --repo "$TARGET_REPO" --state open --limit 200 --json title --jq '.[].title' > /tmp/open_issues.txt 2>/dev/null || touch /tmp/open_issues.txt
          gh issue list --repo "$TARGET_REPO" --state closed --limit 200 --json title --jq '.[].title' >> /tmp/open_issues.txt 2>/dev/null || true

          jq -c '.issues_to_create // [] | .[]' /tmp/assessment.json | while read -r issue; do
            title=$(echo "$issue" | jq -r '.title')
            body=$(echo "$issue" | jq -r '.body')
            labels=$(echo "$issue" | jq -r '.labels | join(",")')

            # Extract key words for fuzzy matching (skip common filler words).
            # Use 5 keywords (not 3) and require 2+ matches to reduce false negatives
            # when the same ask is rephrased across runs (e.g. "configure burn" vs "review burn").
            keywords=$(echo "$title" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9' '\n' | grep -v -E '^(the|a|an|in|on|for|to|of|and|or|is|set|add|configure|verify|check|update|review|approve|implement|basic|define|fix|enable)$' | head -5)
            match_count=0
            while IFS= read -r existing_title; do
              existing_lower=$(echo "$existing_title" | tr '[:upper:]' '[:lower:]')
              hits=0
              for kw in $keywords; do
                if echo "$existing_lower" | grep -q "$kw"; then
                  hits=$((hits + 1))
                fi
              done
              if [ "$hits" -ge 2 ]; then
                match_count=$((match_count + 1))
                break
              fi
            done < /tmp/open_issues.txt

            if [ "$match_count" = "0" ]; then
              # Sanitise issue content before publishing
              if ! echo "$title $body" | bash company/scripts/sanitise.sh > /dev/null 2>&1; then
                echo "SKIPPING issue (failed sanitisation): $title"
                continue
              fi
              gh issue create --repo "$TARGET_REPO" --title "$title" --body "$body" --label "$labels" || true
              echo "$title" >> /tmp/open_issues.txt
            else
              echo "Skipping duplicate: $title"
            fi
          done

      - name: Close issues from assessment
        env:
          GH_TOKEN: ${{ secrets.PUSH_TOKEN }}
          TARGET_REPO: atvirokodosprendimai/wgmesh
        run: |
          jq -c '.issues_to_close // [] | .[]' /tmp/assessment.json | while read -r item; do
            number=$(echo "$item" | jq -r '.number')
            reason=$(echo "$item" | jq -r '.reason')

            # Guard 1: never autonomously close a human escalation. The loop
            # closed needs-human #652 on its own judgment (2026-06-11).
            # Fail-closed: if the label fetch fails we refuse to close blind.
            if ! labels=$(gh issue view "$number" --repo "$TARGET_REPO" --json labels --jq '[.labels[].name] | join(",")' 2>/dev/null); then
              echo "SKIP close #${number}: label fetch failed — refusing to close blind (reason was: $reason)"
              continue
            fi
            if echo ",$labels," | grep -q ",needs-human,"; then
              echo "SKIP close #${number}: needs-human label — human-lane only (reason was: $reason)"
              continue
            fi

            # Guard 2: if the assessment's own reason says relabel/reopen,
            # the disposition is not a close — #652's close comment literally
            # read 'Relabel rather than close' while the step closed it.
            if echo "$reason" | grep -qiE "relabel|reopen|rather than clos"; then
              echo "SKIP close #${number}: reason contradicts close action: $reason"
              continue
            fi

            # Guard 3 (R5): an LLM assessment is a non-merge signal — close
            # as 'not planned', never COMPLETED. COMPLETED is reserved for
            # the merged-impl-PR closer.
            gh issue close "$number" --repo "$TARGET_REPO" --reason "not planned" --comment "Closed by observation loop: $reason" || true
          done

      - name: Create needs-human issue if requested
        env:
          GH_TOKEN: ${{ secrets.PUSH_TOKEN }}
          TARGET_REPO: atvirokodosprendimai/wgmesh
        run: |
          # Reuse open issues list (or fetch if not available)
          if [ ! -f /tmp/open_issues.txt ]; then
            gh issue list --repo "$TARGET_REPO" --state open --limit 100 --json title --jq '.[].title' > /tmp/open_issues.txt 2>/dev/null || touch /tmp/open_issues.txt
          fi

          jq -c '.needs_human // [] | .[]' /tmp/assessment.json | while read -r req; do
            request=$(echo "$req" | jq -r '.request')
            reason=$(echo "$req" | jq -r '.reason')
            urgency=$(echo "$req" | jq -r '.urgency')
            full_title="[needs-human] $request"

            # Fuzzy dedup against existing open issues (5 keywords, expanded stop words)
            keywords=$(echo "$request" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9' '\n' | grep -v -E '^(the|a|an|in|on|for|to|of|and|or|is|set|add|configure|verify|check|update|review|approve|implement|basic|define|fix|enable)$' | head -5)
            match_count=0
            while IFS= read -r existing_title; do
              existing_lower=$(echo "$existing_title" | tr '[:upper:]' '[:lower:]')
              hits=0
              for kw in $keywords; do
                if echo "$existing_lower" | grep -q "$kw"; then
                  hits=$((hits + 1))
                fi
              done
              if [ "$hits" -ge 2 ]; then
                match_count=$((match_count + 1))
                break
              fi
            done < /tmp/open_issues.txt

            if [ "$match_count" = "0" ]; then
              body=$(printf '**Urgency**: %s\n\n**Reason**: %s\n\n_Created by observation loop._' "$urgency" "$reason")
              # Sanitise issue content before publishing
              if ! echo "$full_title $body" | bash company/scripts/sanitise.sh > /dev/null 2>&1; then
                echo "SKIPPING needs-human issue (failed sanitisation): $full_title"
                continue
              fi
              gh issue create \
                --repo "$TARGET_REPO" \
                --title "$full_title" \
                --body "$body" \
                --label "needs-human" || true
              echo "$full_title" >> /tmp/open_issues.txt
            else
              echo "Skipping duplicate needs-human: $request"
            fi
          done

      - name: Close PRs from assessment
        env:
          GH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: |
          jq -c '.prs_to_close // [] | .[]' /tmp/assessment.json | while read -r item; do
            repo=$(echo "$item" | jq -r '.repo')
            number=$(echo "$item" | jq -r '.number')
            reason=$(echo "$item" | jq -r '.reason')
            full_repo="atvirokodosprendimai/${repo}"
            gh pr close "$number" --repo "$full_repo" \
              --comment "Closed by observation loop: $reason" || true
            echo "Closed PR #${number} in ${full_repo}: ${reason}"
          done

      - name: Sweep stale needs-triage issues
        env:
          GH_TOKEN: ${{ secrets.PUSH_TOKEN }}
          TARGET_REPO: atvirokodosprendimai/wgmesh
        run: |
          # Find issues labeled 'needs-triage' that are older than 24h.
          # This catches issues where the copilot-triage workflow fired but
          # failed silently, or where the label was added before the workflow
          # existed. Re-applying the label re-triggers the triage workflow.
          cutoff=$(date -u -d '24 hours ago' '+%Y-%m-%dT%H:%M:%SZ' 2>/dev/null || \
                   date -u -v-24H '+%Y-%m-%dT%H:%M:%SZ' 2>/dev/null || echo "")

          if [ -z "$cutoff" ]; then
            echo "::warning::Could not compute 24h cutoff — skipping stale triage sweep"
            exit 0
          fi

          gh issue list --repo "$TARGET_REPO" --state open --label "needs-triage" --limit 50 \
            --json number,title,createdAt \
            --jq --arg cutoff "$cutoff" '.[] | select(.createdAt < $cutoff) | "\(.number)\t\(.title)"' \
          | while IFS=$'\t' read -r number title; do
            echo "Stale needs-triage: #${number} ${title} — re-triggering"
            gh issue edit "$number" --repo "$TARGET_REPO" --remove-label "needs-triage" 2>/dev/null || true
            sleep 2
            gh issue edit "$number" --repo "$TARGET_REPO" --add-label "needs-triage" 2>/dev/null || true
          done
