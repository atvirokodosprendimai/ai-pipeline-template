name: Pipeline Health (Self-Healing)

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 minutes
  workflow_dispatch:
    inputs:
      cutoff_override_minutes:
        description: 'Override stale cutoff (minutes). For E2E testing.'
        required: false
        default: ''

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read

concurrency:
  group: pipeline-health
  cancel-in-progress: false

env:
  TARGET_REPO: atvirokodosprendimai/wgmesh

jobs:
  heal:
    name: Diagnose → Heal → Report
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      # ── Read current state ────────────────────────────────────
      - name: Read pipeline health state
        id: state
        run: |
          state_file="company/pipeline-health-state.json"
          # shellcheck disable=SC2129
          echo "STATE_FILE=$state_file" >> "$GITHUB_ENV"
          if [ -f "$state_file" ]; then
            PRE_RUN_LAST_CHECK=$(jq -r '.last_check // ""' "$state_file")
            echo "checks_run=$(jq -r '.checks_run // 0' "$state_file")" >> "$GITHUB_ENV"
            echo "issues_healed_total=$(jq -r '.issues_healed_total // 0' "$state_file")" >> "$GITHUB_ENV"
          else
            PRE_RUN_LAST_CHECK=""
            echo "checks_run=0" >> "$GITHUB_ENV"
            echo "issues_healed_total=0" >> "$GITHUB_ENV"
          fi
          echo "PRE_RUN_LAST_CHECK=$PRE_RUN_LAST_CHECK" >> "$GITHUB_ENV"

      # ── Initialize run counters ───────────────────────────────
      - name: Initialize run counters
        run: |
          # shellcheck disable=SC2129
          echo "ACTIONS_TAKEN=0" >> "$GITHUB_ENV"
          echo "ERRORS=0" >> "$GITHUB_ENV"
          echo "ISSUES_CREATED=0" >> "$GITHUB_ENV"
          echo "STALE_TRIAGE_FOUND=0" >> "$GITHUB_ENV"
          echo "STALE_COPILOT_FOUND=0" >> "$GITHUB_ENV"
          echo "STALE_APPROVED_FOUND=0" >> "$GITHUB_ENV"
          echo "NEEDS_HUMAN_CLOSED=0" >> "$GITHUB_ENV"
          echo "CIRCUIT_BREAKER_TRIPPED=false" >> "$GITHUB_ENV"

      # ── Phase 2 healing checks ───────────────────────────────
      - name: "Check stale needs-triage issues"
        id: stale_triage
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.PUSH_TOKEN }}
          CUTOFF_OVERRIDE: ${{ inputs.cutoff_override_minutes }}
        run: |
          STATE_FILE="company/pipeline-health-state.json"
          AUDIT_LOG="company/audit-log.jsonl"
          RUN_ID="${GITHUB_RUN_ID:-local}"
          local_actions=0
          local_errors=0
          local_issues_created=0
          local_stale=0

          # Dual-platform date math (override via CUTOFF_OVERRIDE for E2E)
          if [ -n "$CUTOFF_OVERRIDE" ]; then
            cutoff=$(date -u -d "$CUTOFF_OVERRIDE minutes ago" '+%Y-%m-%dT%H:%M:%SZ' 2>/dev/null || \
                     date -u -v-"${CUTOFF_OVERRIDE}"M '+%Y-%m-%dT%H:%M:%SZ')
          else
            cutoff=$(date -u -d '24 hours ago' '+%Y-%m-%dT%H:%M:%SZ' 2>/dev/null || \
                     date -u -v-24H '+%Y-%m-%dT%H:%M:%SZ' 2>/dev/null || echo "")
          fi

          if [ -z "$cutoff" ]; then
            echo "::warning::Could not compute 24h cutoff — skipping stale triage sweep"
            exit 0
          fi

          echo "Cutoff: $cutoff"

          if ! gh issue list --repo "$TARGET_REPO" --state open \
            --label "needs-triage" --limit 50 \
            --json number,title,createdAt,labels \
            --jq ".[] | select(.createdAt < \"$cutoff\") | @json" \
            > /tmp/stale_triage.json; then
            echo "::error::stale needs-triage detection query failed"
            exit 1
          fi

          while read -r issue; do
            number=$(echo "$issue" | jq -r '.number')
            # shellcheck disable=SC2034
            title=$(echo "$issue" | jq -r '.title')
            labels=$(echo "$issue" | jq -r '[.labels[].name] | join(",")')

            # Skip manual-only
            if echo "$labels" | grep -q "manual-only"; then
              echo "Skipping #${number} — manual-only"
              continue
            fi

            # Skip issues also labeled wont-do, needs-info
            if echo "$labels" | grep -qE "(wont-do|needs-info)"; then
              echo "Skipping #${number} — has exclusion label"
              continue
            fi

            # Skip completed issues: a merged spec/impl PR for this issue already
            # exists. Reopened or stale-labelled done work must NOT be re-triaged
            # or escalated as "stuck" (false positives like #540, whose impl PR
            # #544 merged with "Closes #540" yet was reopened). The issue number
            # is encoded in spec/impl PR titles ("... Issue #N ..."). Uses the
            # List API (--state merged) + jq title match, NOT the Search API —
            # deterministic, no eventual-consistency flakiness (cf. PR #1441).
            # closedByPullRequestsReferences was tried first but returns empty
            # once an issue is reopened, so it cannot be used.
            merged_pr=$(gh pr list --repo "$TARGET_REPO" --state merged --limit 300 \
              --json title \
              --jq "[.[] | select(.title | test(\"Issue #${number}\\\\b\"))] | length" 2>/dev/null || echo 0)
            if [ "${merged_pr:-0}" -gt 0 ]; then
              echo "Skipping #${number} — completed (merged spec/impl PR exists), not stuck"
              continue
            fi

            local_stale=$((local_stale + 1))

            # Read retry tracker
            retries=$(jq -r --arg n "$number" '.retry_tracker[$n].retries // 0' "$STATE_FILE")
            cooldown=$(jq -r --arg n "$number" '.retry_tracker[$n].cooldown_until // ""' "$STATE_FILE")

            # Check cooldown
            if [ -n "$cooldown" ] && [ "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \< "$cooldown" ]; then
              echo "Skipping #${number} — in cooldown until $cooldown"
              continue
            fi

            # Escalate after 2 failures
            if [ "$retries" -ge 2 ]; then
              echo "Escalating #${number} — $retries consecutive failures"
              body="Self-healing failed to resolve stale triage for #${number} after $retries attempts."
              esc_title="[needs-human] Stuck at triage: #${number}"
              if echo "$body" | bash company/scripts/sanitise.sh > /dev/null 2>&1; then
                gh issue create --repo "$TARGET_REPO" \
                  --title "$esc_title" \
                  --body "$body" \
                  --label "needs-human" || { local_errors=$((local_errors + 1)); true; }
                local_issues_created=$((local_issues_created + 1))
                local_actions=$((local_actions + 1))
              else
                echo "SKIPPING (failed sanitisation): $esc_title"
                local_errors=$((local_errors + 1))
              fi
              # Set 24h cooldown
              cooldown_until=$(date -u -d '+24 hours' '+%Y-%m-%dT%H:%M:%SZ' 2>/dev/null || \
                               date -u -v+24H '+%Y-%m-%dT%H:%M:%SZ')
              jq --arg n "$number" --arg until "$cooldown_until" \
                '.retry_tracker[$n].cooldown_until = $until' "$STATE_FILE" > /tmp/state.json && \
              mv /tmp/state.json "$STATE_FILE"
              # Audit
              jq -nc --arg ts "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" --arg rid "$RUN_ID" \
                --arg num "$number" --argjson retries "$retries" \
                '{timestamp:$ts, run_id:$rid, action:"escalate", issue_number:($num|tonumber), target_repo:"wgmesh", reason:"2 consecutive triage failures", outcome:"success", retry_count:$retries}' \
                >> "$AUDIT_LOG"
              continue
            fi

            # Recovery: toggle label to re-trigger copilot-triage.yml
            echo "Healing #${number}: removing needs-triage label"
            gh issue edit "$number" --repo "$TARGET_REPO" \
              --remove-label "needs-triage" 2>/dev/null || { local_errors=$((local_errors + 1)); true; }
            sleep 2
            echo "Healing #${number}: re-applying needs-triage label"
            gh issue edit "$number" --repo "$TARGET_REPO" \
              --add-label "needs-triage" 2>/dev/null || { local_errors=$((local_errors + 1)); true; }
            local_actions=$((local_actions + 1))

            # Update retry tracker
            new_retries=$((retries + 1))
            jq --arg n "$number" --argjson r "$new_retries" \
              --arg ts "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
              '.retry_tracker[$n] = {retries: $r, last_retry: $ts, action: "retrigger_triage"}' \
              "$STATE_FILE" > /tmp/state.json && \
            mv /tmp/state.json "$STATE_FILE"

            # Audit
            jq -nc --arg ts "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" --arg rid "$RUN_ID" \
              --arg num "$number" --argjson retries "$new_retries" \
              '{timestamp:$ts, run_id:$rid, action:"retrigger_triage", issue_number:($num|tonumber), target_repo:"wgmesh", reason:"stale >24h at needs-triage", outcome:"success", retry_count:$retries}' \
              >> "$AUDIT_LOG"
          done < /tmp/stale_triage.json

          # Write counters to GITHUB_ENV
          # shellcheck disable=SC2129
          echo "ACTIONS_TAKEN=$((ACTIONS_TAKEN + local_actions))" >> "$GITHUB_ENV"
          echo "ERRORS=$((ERRORS + local_errors))" >> "$GITHUB_ENV"
          echo "ISSUES_CREATED=$((ISSUES_CREATED + local_issues_created))" >> "$GITHUB_ENV"
          echo "STALE_TRIAGE_FOUND=$((STALE_TRIAGE_FOUND + local_stale))" >> "$GITHUB_ENV"

      - name: "Circuit breaker check (after triage)"
        if: env.CIRCUIT_BREAKER_TRIPPED != 'true'
        env:
          GH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: |
          MAX_CREATES=10
          MAX_ERRORS=5
          if [ "$ISSUES_CREATED" -ge "$MAX_CREATES" ] || [ "$ERRORS" -ge "$MAX_ERRORS" ]; then
            echo "::error::Circuit breaker triggered: $ISSUES_CREATED creates, $ERRORS errors"
            echo "CIRCUIT_BREAKER_TRIPPED=true" >> "$GITHUB_ENV"
            body="Self-healing hit per-run limits: $ISSUES_CREATED issues created, $ERRORS errors. Manual review required."
            if echo "$body" | bash company/scripts/sanitise.sh > /dev/null 2>&1; then
              gh issue create --repo "$TARGET_REPO" \
                --title "[needs-human] Pipeline self-healing circuit breaker triggered" \
                --body "$body" \
                --label "needs-human" || true
            fi
            jq -nc --arg ts "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" --arg rid "${GITHUB_RUN_ID:-local}" \
              '{timestamp:$ts, run_id:$rid, action:"circuit_breaker", issue_number:null, target_repo:"wgmesh", reason:"per-run limit exceeded", outcome:"success", retry_count:null}' \
              >> company/audit-log.jsonl
          fi

      - name: "Check stale copilot-triaging issues"
        id: stale_copilot
        continue-on-error: true
        if: env.CIRCUIT_BREAKER_TRIPPED != 'true'
        env:
          GH_TOKEN: ${{ secrets.PUSH_TOKEN }}
          CUTOFF_OVERRIDE: ${{ inputs.cutoff_override_minutes }}
        run: |
          STATE_FILE="company/pipeline-health-state.json"
          AUDIT_LOG="company/audit-log.jsonl"
          RUN_ID="${GITHUB_RUN_ID:-local}"
          local_actions=0
          local_errors=0
          local_issues_created=0
          local_stale=0

          # Dual-platform date math (override via CUTOFF_OVERRIDE for E2E)
          if [ -n "$CUTOFF_OVERRIDE" ]; then
            cutoff=$(date -u -d "$CUTOFF_OVERRIDE minutes ago" '+%Y-%m-%dT%H:%M:%SZ' 2>/dev/null || \
                     date -u -v-"${CUTOFF_OVERRIDE}"M '+%Y-%m-%dT%H:%M:%SZ')
          else
            cutoff=$(date -u -d '48 hours ago' '+%Y-%m-%dT%H:%M:%SZ' 2>/dev/null || \
                     date -u -v-48H '+%Y-%m-%dT%H:%M:%SZ' 2>/dev/null || echo "")
          fi

          if [ -z "$cutoff" ]; then
            echo "::warning::Could not compute 48h cutoff — skipping stale copilot sweep"
            exit 0
          fi

          echo "Cutoff: $cutoff"

          if ! gh issue list --repo "$TARGET_REPO" --state open \
            --label "copilot-triaging" --limit 50 \
            --json number,title,createdAt,labels \
            --jq ".[] | select(.createdAt < \"$cutoff\") | @json" \
            > /tmp/stale_copilot.json; then
            echo "::error::stale copilot-triaging detection query failed"
            exit 1
          fi

          while read -r issue; do
            number=$(echo "$issue" | jq -r '.number')
            # shellcheck disable=SC2034
            title=$(echo "$issue" | jq -r '.title')
            labels=$(echo "$issue" | jq -r '[.labels[].name] | join(",")')

            # Skip manual-only
            if echo "$labels" | grep -q "manual-only"; then
              echo "Skipping #${number} — manual-only"
              continue
            fi

            local_stale=$((local_stale + 1))

            # Check if a spec PR already exists for this issue
            spec_pr=$(gh pr list --repo "$TARGET_REPO" --state open \
              --search "spec: Issue #${number}" --json number --jq '.[0].number // empty' 2>/dev/null || echo "")

            if [ -n "$spec_pr" ]; then
              echo "Skipping #${number} — spec PR #${spec_pr} in progress"
              continue
            fi

            # Read retry tracker
            retries=$(jq -r --arg n "$number" '.retry_tracker[$n].retries // 0' "$STATE_FILE")
            cooldown=$(jq -r --arg n "$number" '.retry_tracker[$n].cooldown_until // ""' "$STATE_FILE")

            if [ -n "$cooldown" ] && [ "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \< "$cooldown" ]; then
              echo "Skipping #${number} — in cooldown until $cooldown"
              continue
            fi

            # Escalate after 2 failures
            if [ "$retries" -ge 2 ]; then
              echo "Escalating #${number} — $retries consecutive failures"
              body="Self-healing failed to resolve stale copilot-triaging for #${number} after $retries attempts."
              esc_title="[needs-human] Stuck at copilot-triaging: #${number}"
              if echo "$body" | bash company/scripts/sanitise.sh > /dev/null 2>&1; then
                gh issue create --repo "$TARGET_REPO" \
                  --title "$esc_title" \
                  --body "$body" \
                  --label "needs-human" || { local_errors=$((local_errors + 1)); true; }
                local_issues_created=$((local_issues_created + 1))
                local_actions=$((local_actions + 1))
              else
                echo "SKIPPING (failed sanitisation): $esc_title"
                local_errors=$((local_errors + 1))
              fi
              cooldown_until=$(date -u -d '+24 hours' '+%Y-%m-%dT%H:%M:%SZ' 2>/dev/null || \
                               date -u -v+24H '+%Y-%m-%dT%H:%M:%SZ')
              jq --arg n "$number" --arg until "$cooldown_until" \
                '.retry_tracker[$n].cooldown_until = $until' "$STATE_FILE" > /tmp/state.json && \
              mv /tmp/state.json "$STATE_FILE"
              jq -nc --arg ts "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" --arg rid "$RUN_ID" \
                --arg num "$number" --argjson retries "$retries" \
                '{timestamp:$ts, run_id:$rid, action:"escalate", issue_number:($num|tonumber), target_repo:"wgmesh", reason:"2 consecutive copilot-triaging failures", outcome:"success", retry_count:$retries}' \
                >> "$AUDIT_LOG"
              continue
            fi

            # Recovery: remove copilot-triaging, re-add needs-triage (fresh triage)
            echo "Healing #${number}: removing copilot-triaging label"
            gh issue edit "$number" --repo "$TARGET_REPO" \
              --remove-label "copilot-triaging" 2>/dev/null || { local_errors=$((local_errors + 1)); true; }
            sleep 2
            echo "Healing #${number}: adding needs-triage label (fresh triage)"
            gh issue edit "$number" --repo "$TARGET_REPO" \
              --add-label "needs-triage" 2>/dev/null || { local_errors=$((local_errors + 1)); true; }
            local_actions=$((local_actions + 1))

            # Update retry tracker
            new_retries=$((retries + 1))
            jq --arg n "$number" --argjson r "$new_retries" \
              --arg ts "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
              '.retry_tracker[$n] = {retries: $r, last_retry: $ts, action: "retrigger_copilot"}' \
              "$STATE_FILE" > /tmp/state.json && \
            mv /tmp/state.json "$STATE_FILE"

            jq -nc --arg ts "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" --arg rid "$RUN_ID" \
              --arg num "$number" --argjson retries "$new_retries" \
              '{timestamp:$ts, run_id:$rid, action:"retrigger_copilot", issue_number:($num|tonumber), target_repo:"wgmesh", reason:"stale >48h at copilot-triaging", outcome:"success", retry_count:$retries}' \
              >> "$AUDIT_LOG"
          done < /tmp/stale_copilot.json

          # Write counters to GITHUB_ENV
          # shellcheck disable=SC2129
          echo "ACTIONS_TAKEN=$((ACTIONS_TAKEN + local_actions))" >> "$GITHUB_ENV"
          echo "ERRORS=$((ERRORS + local_errors))" >> "$GITHUB_ENV"
          echo "ISSUES_CREATED=$((ISSUES_CREATED + local_issues_created))" >> "$GITHUB_ENV"
          echo "STALE_COPILOT_FOUND=$((STALE_COPILOT_FOUND + local_stale))" >> "$GITHUB_ENV"

      - name: Check circuit breaker (post-copilot)
        if: env.CIRCUIT_BREAKER_TRIPPED == 'false'
        run: |
          if [ "$ISSUES_CREATED" -ge 10 ] || [ "$ERRORS" -ge 5 ]; then
            echo "CIRCUIT_BREAKER_TRIPPED=true" >> "$GITHUB_ENV"
            echo "::error::Circuit breaker tripped: ${ISSUES_CREATED} issues created, ${ERRORS} errors"
          fi

      - name: "Check stale approved-for-build PRs"
        id: stale_approved
        continue-on-error: true
        if: env.CIRCUIT_BREAKER_TRIPPED != 'true'
        env:
          GH_TOKEN: ${{ secrets.PUSH_TOKEN }}
          CUTOFF_OVERRIDE: ${{ inputs.cutoff_override_minutes }}
        run: |
          STATE_FILE="company/pipeline-health-state.json"
          AUDIT_LOG="company/audit-log.jsonl"
          RUN_ID="${GITHUB_RUN_ID:-local}"
          local_actions=0
          local_errors=0
          local_issues_created=0
          local_stale=0

          # Dual-platform date math (override via CUTOFF_OVERRIDE for E2E)
          if [ -n "$CUTOFF_OVERRIDE" ]; then
            cutoff=$(date -u -d "$CUTOFF_OVERRIDE minutes ago" '+%Y-%m-%dT%H:%M:%SZ' 2>/dev/null || \
                     date -u -v-"${CUTOFF_OVERRIDE}"M '+%Y-%m-%dT%H:%M:%SZ')
          else
            cutoff=$(date -u -d '24 hours ago' '+%Y-%m-%dT%H:%M:%SZ' 2>/dev/null || \
                     date -u -v-24H '+%Y-%m-%dT%H:%M:%SZ' 2>/dev/null || echo "")
          fi

          if [ -z "$cutoff" ]; then
            echo "::warning::Could not compute 24h cutoff — skipping stale build sweep"
            exit 0
          fi

          echo "Cutoff: $cutoff"

          if ! gh pr list --repo "$TARGET_REPO" --state open \
            --label "approved-for-build" --limit 50 \
            --json number,title,updatedAt,labels \
            --jq ".[] | select(.updatedAt < \"$cutoff\") | @json" \
            > /tmp/stale_approved.json; then
            echo "::error::stale approved-for-build detection query failed"
            exit 1
          fi

          while read -r pr; do
            number=$(echo "$pr" | jq -r '.number')
            title=$(echo "$pr" | jq -r '.title')
            labels=$(echo "$pr" | jq -r '[.labels[].name] | join(",")')

            # Skip manual-only
            if echo "$labels" | grep -q "manual-only"; then
              echo "Skipping PR #${number} — manual-only"
              continue
            fi

            local_stale=$((local_stale + 1))

            # Extract issue number from spec PR title: "spec: Issue #123 - ..."
            issue_num=$(echo "$title" | grep -oP 'Issue #\K\d+' || echo "")

            # Check if an impl PR already exists
            if [ -n "$issue_num" ]; then
              impl_pr=$(gh pr list --repo "$TARGET_REPO" --state open \
                --search "impl: Issue #${issue_num}" --json number --jq '.[0].number // empty' 2>/dev/null || echo "")
              if [ -n "$impl_pr" ]; then
                echo "Skipping PR #${number} — impl PR #${impl_pr} in progress"
                continue
              fi
            fi

            # Read retry tracker (use PR number as key)
            retries=$(jq -r --arg n "pr-$number" '.retry_tracker[$n].retries // 0' "$STATE_FILE")
            cooldown=$(jq -r --arg n "pr-$number" '.retry_tracker[$n].cooldown_until // ""' "$STATE_FILE")

            if [ -n "$cooldown" ] && [ "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \< "$cooldown" ]; then
              echo "Skipping PR #${number} — in cooldown until $cooldown"
              continue
            fi

            # Escalate after 2 failures
            if [ "$retries" -ge 2 ]; then
              echo "Escalating PR #${number} — $retries consecutive failures"
              body="Self-healing failed to resolve stale approved-for-build PR #${number} after $retries attempts."
              esc_title="[needs-human] Stuck at build: PR #${number}"
              if echo "$body" | bash company/scripts/sanitise.sh > /dev/null 2>&1; then
                gh issue create --repo "$TARGET_REPO" \
                  --title "$esc_title" \
                  --body "$body" \
                  --label "needs-human" || { local_errors=$((local_errors + 1)); true; }
                local_issues_created=$((local_issues_created + 1))
                local_actions=$((local_actions + 1))
              else
                echo "SKIPPING (failed sanitisation): $esc_title"
                local_errors=$((local_errors + 1))
              fi
              cooldown_until=$(date -u -d '+24 hours' '+%Y-%m-%dT%H:%M:%SZ' 2>/dev/null || \
                               date -u -v+24H '+%Y-%m-%dT%H:%M:%SZ')
              jq --arg n "pr-$number" --arg until "$cooldown_until" \
                '.retry_tracker[$n].cooldown_until = $until' "$STATE_FILE" > /tmp/state.json && \
              mv /tmp/state.json "$STATE_FILE"
              jq -nc --arg ts "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" --arg rid "$RUN_ID" \
                --arg num "$number" --argjson retries "$retries" \
                '{timestamp:$ts, run_id:$rid, action:"escalate", issue_number:($num|tonumber), target_repo:"wgmesh", reason:"2 consecutive build trigger failures", outcome:"success", retry_count:$retries}' \
                >> "$AUDIT_LOG"
              continue
            fi

            # Recovery: toggle approved-for-build label to re-trigger goose-build
            echo "Healing PR #${number}: removing approved-for-build label"
            gh pr edit "$number" --repo "$TARGET_REPO" \
              --remove-label "approved-for-build" 2>/dev/null || { local_errors=$((local_errors + 1)); true; }
            sleep 2
            echo "Healing PR #${number}: re-applying approved-for-build label"
            gh pr edit "$number" --repo "$TARGET_REPO" \
              --add-label "approved-for-build" 2>/dev/null || { local_errors=$((local_errors + 1)); true; }
            local_actions=$((local_actions + 1))

            # Update retry tracker
            new_retries=$((retries + 1))
            jq --arg n "pr-$number" --argjson r "$new_retries" \
              --arg ts "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
              '.retry_tracker[$n] = {retries: $r, last_retry: $ts, action: "retrigger_goose"}' \
              "$STATE_FILE" > /tmp/state.json && \
            mv /tmp/state.json "$STATE_FILE"

            jq -nc --arg ts "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" --arg rid "$RUN_ID" \
              --arg num "$number" --argjson retries "$new_retries" \
              '{timestamp:$ts, run_id:$rid, action:"retrigger_goose", issue_number:($num|tonumber), target_repo:"wgmesh", reason:"stale >24h at approved-for-build", outcome:"success", retry_count:$retries}' \
              >> "$AUDIT_LOG"
          done < /tmp/stale_approved.json

          # Write counters to GITHUB_ENV
          # shellcheck disable=SC2129
          echo "ACTIONS_TAKEN=$((ACTIONS_TAKEN + local_actions))" >> "$GITHUB_ENV"
          echo "ERRORS=$((ERRORS + local_errors))" >> "$GITHUB_ENV"
          echo "ISSUES_CREATED=$((ISSUES_CREATED + local_issues_created))" >> "$GITHUB_ENV"
          echo "STALE_APPROVED_FOUND=$((STALE_APPROVED_FOUND + local_stale))" >> "$GITHUB_ENV"

      - name: Check circuit breaker (post-approved)
        if: env.CIRCUIT_BREAKER_TRIPPED == 'false'
        run: |
          if [ "$ISSUES_CREATED" -ge 10 ] || [ "$ERRORS" -ge 5 ]; then
            echo "CIRCUIT_BREAKER_TRIPPED=true" >> "$GITHUB_ENV"
            echo "::error::Circuit breaker tripped: ${ISSUES_CREATED} issues created, ${ERRORS} errors"
          fi

      - name: "Check fulfilled needs-human issues"
        if: env.CIRCUIT_BREAKER_TRIPPED != 'true'
        env:
          GH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: |
          AUDIT_LOG="company/audit-log.jsonl"
          RUN_ID="${GITHUB_RUN_ID:-local}"
          local_actions=0
          local_errors=0
          local_closed=0

          gh issue list --repo "$TARGET_REPO" --state open \
            --label "needs-human" --limit 50 \
            --json number,title,labels \
            --jq '.[] | @json' \
            > /tmp/needs_human.json || true

          while read -r issue; do
            number=$(echo "$issue" | jq -r '.number')
            title=$(echo "$issue" | jq -r '.title')
            labels=$(echo "$issue" | jq -r '[.labels[].name] | join(",")')

            # Skip manual-only
            if echo "$labels" | grep -q "manual-only"; then
              echo "Skipping #${number} — manual-only"
              continue
            fi

            resolved=""
            reason=""

            # Signal 1: Check for linked merged PRs
            merged_prs=$(gh api "repos/$TARGET_REPO/issues/${number}/timeline" \
              --jq '[.[] | select(.event == "cross-referenced" and .source.issue.pull_request.merged_at != null)] | length' \
              2>/dev/null || echo "0")
            if [ "$merged_prs" -gt 0 ] 2>/dev/null; then
              resolved="true"
              reason="Linked PR merged ($merged_prs merged PR(s) found)"
            fi

            # Signal 2: Title pattern matching
            if [ -z "$resolved" ]; then
              title_lower=$(echo "$title" | tr '[:upper:]' '[:lower:]')

              if echo "$title_lower" | grep -qE "(api key|secret)"; then
                # Check if observation-loop last run succeeded
                loop_status=$(jq -r '.last_run // ""' company/loop-state.json 2>/dev/null || echo "")
                run_count=$(jq -r '.run_count // 0' company/loop-state.json 2>/dev/null || echo "0")
                if [ -n "$loop_status" ] && [ "$run_count" -gt 0 ]; then
                  resolved="true"
                  reason="Observation loop running successfully (run_count=$run_count)"
                fi
              elif echo "$title_lower" | grep -qE "(health|endpoint)"; then
                # Curl each endpoint in health.json
                all_healthy="true"
                endpoints=$(jq -r '.endpoints[].url' company/health.json 2>/dev/null || echo "")
                if [ -z "$endpoints" ]; then
                  all_healthy=""
                fi
                for url in $endpoints; do
                  status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$url" 2>/dev/null || echo "000")
                  if [ "$status" -lt 200 ] || [ "$status" -ge 400 ]; then
                    all_healthy=""
                    break
                  fi
                done
                if [ -n "$all_healthy" ]; then
                  resolved="true"
                  reason="All health endpoints responding OK"
                fi
              elif echo "$title_lower" | grep -qE "(burn|capital|budget)"; then
                # Check costs.json has non-default values
                capital=$(jq -r '.runway.available_capital // 0' company/costs.json 2>/dev/null || echo "0")
                if [ "$capital" -gt 0 ] 2>/dev/null; then
                  resolved="true"
                  reason="Costs data populated (available_capital=$capital)"
                fi
              fi
            fi

            # If resolved, close the issue
            if [ -n "$resolved" ]; then
              echo "Closing #${number} — resolved: $reason"
              comment="Resolved by self-healing: $reason"
              if echo "$comment" | bash company/scripts/sanitise.sh > /dev/null 2>&1; then
                gh issue close "$number" --repo "$TARGET_REPO" \
                  --comment "$comment" 2>/dev/null || { local_errors=$((local_errors + 1)); true; }
                local_closed=$((local_closed + 1))
                local_actions=$((local_actions + 1))
              else
                echo "SKIPPING (failed sanitisation): close #${number}"
                local_errors=$((local_errors + 1))
              fi
              # Audit
              jq -nc --arg ts "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" --arg rid "$RUN_ID" \
                --arg num "$number" --arg reason "$reason" \
                '{timestamp:$ts, run_id:$rid, action:"close_needs_human", issue_number:($num|tonumber), target_repo:"wgmesh", reason:$reason, outcome:"success", retry_count:null}' \
                >> "$AUDIT_LOG"
            else
              echo "No resolution signal for #${number} — $title"
            fi
          done < /tmp/needs_human.json

          # Write counters to GITHUB_ENV
          # shellcheck disable=SC2129
          echo "ACTIONS_TAKEN=$((ACTIONS_TAKEN + local_actions))" >> "$GITHUB_ENV"
          echo "ERRORS=$((ERRORS + local_errors))" >> "$GITHUB_ENV"
          echo "NEEDS_HUMAN_CLOSED=$((NEEDS_HUMAN_CLOSED + local_closed))" >> "$GITHUB_ENV"

      - name: "Check funnel signals"
        if: env.CIRCUIT_BREAKER_TRIPPED != 'true'
        env:
          GH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: |
          STATE_FILE="company/pipeline-health-state.json"
          AUDIT_LOG="company/audit-log.jsonl"
          RUN_ID="${GITHUB_RUN_ID:-local}"

          dogfood_signal="false"
          presence_signal="false"

          # Fetch CLAUDE.md from wgmesh to check dogfood signal
          wgmesh_claude=$(gh api repos/atvirokodosprendimai/wgmesh/contents/CLAUDE.md \
            --jq '.content' 2>/dev/null | base64 -d 2>/dev/null || echo "")

          if [ -n "$wgmesh_claude" ]; then
            has_architecture=$(echo "$wgmesh_claude" | grep -ci "Architecture" || echo "0")
            has_build=$(echo "$wgmesh_claude" | grep -ci "Build" || echo "0")
            if [ "$has_architecture" -gt 0 ] && [ "$has_build" -gt 0 ]; then
              dogfood_signal="true"
              echo "Dogfood signal: CLAUDE.md has Architecture and Build sections"
            else
              echo "Dogfood signal: CLAUDE.md missing Architecture ($has_architecture) or Build ($has_build) sections"
            fi
          else
            echo "Dogfood signal: could not fetch CLAUDE.md from wgmesh"
          fi

          # Check health endpoints for presence signal
          all_present="true"
          endpoint_results=""
          endpoints=$(jq -r '.endpoints[] | "\(.name)|\(.url)"' company/health.json 2>/dev/null || echo "")

          if [ -z "$endpoints" ]; then
            all_present="false"
            echo "Presence signal: no endpoints configured"
          else
            while IFS='|' read -r name url; do
              status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$url" 2>/dev/null || echo "000")
              if [ "$status" -ge 200 ] && [ "$status" -lt 400 ]; then
                echo "Presence signal: $name ($url) — OK ($status)"
                endpoint_results="${endpoint_results}${name}:ok,"
              else
                echo "Presence signal: $name ($url) — FAIL ($status)"
                endpoint_results="${endpoint_results}${name}:fail,"
                all_present="false"
              fi
            done <<< "$endpoints"
          fi

          if [ "$all_present" = "true" ]; then
            presence_signal="true"
          fi

          # Write signals to state file under funnel_signals key
          # Do NOT modify company/loop-state.json
          now=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          jq --arg ds "$dogfood_signal" --arg ps "$presence_signal" \
            --arg ep "${endpoint_results%,}" --arg ts "$now" \
            '.funnel_signals = {
              dogfood: ($ds == "true"),
              presence: ($ps == "true"),
              endpoint_details: $ep,
              checked_at: $ts
            }' "$STATE_FILE" > /tmp/state.json && \
          mv /tmp/state.json "$STATE_FILE"

          # Audit
          jq -nc --arg ts "$now" --arg rid "$RUN_ID" \
            --arg ds "$dogfood_signal" --arg ps "$presence_signal" \
            '{timestamp:$ts, run_id:$rid, action:"check_funnel_signals", issue_number:null, target_repo:"wgmesh", reason:"periodic signal check", outcome:"success", retry_count:null, signals:{dogfood:($ds == "true"), presence:($ps == "true")}}' \
            >> "$AUDIT_LOG"

          echo "Funnel signals — dogfood: $dogfood_signal, presence: $presence_signal"

      - name: Check idle pipeline signal
        env:
          GH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: |
          STATE_FILE="company/pipeline-health-state.json"
          now=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          existing_last_dispatch=$(jq -r '.idle_signal.last_dispatch_at // ""' "$STATE_FILE")

          open_prs=$(gh pr list --repo "$TARGET_REPO" --state open --limit 50 --json number | jq 'length')
          active_pipeline_issues=$(gh issue list --repo "$TARGET_REPO" --state open --limit 100 --json labels \
            | jq '[.[] | select(any(.labels[].name; . == "needs-triage" or . == "copilot-triaging" or . == "copilot-revising" or . == "approved-for-build" or . == "goose-implementation"))] | length')

          idle="false"
          if [ "$open_prs" -eq 0 ] && [ "$active_pipeline_issues" -eq 0 ] && [ "$ACTIONS_TAKEN" -eq 0 ] && [ "$ERRORS" -eq 0 ]; then
            idle="true"
          fi

          jq \
            --argjson idle "$( [ "$idle" = "true" ] && echo true || echo false )" \
            --argjson open_prs "$open_prs" \
            --argjson active_pipeline_issues "$active_pipeline_issues" \
            --arg ts "$now" \
            --arg last_dispatch "$existing_last_dispatch" \
            '.idle_signal = ({
              idle: $idle,
              open_prs: $open_prs,
              active_pipeline_issues: $active_pipeline_issues,
              checked_at: $ts
            } + if $last_dispatch != "" then {last_dispatch_at: $last_dispatch} else {} end)' \
            "$STATE_FILE" > /tmp/state.json && mv /tmp/state.json "$STATE_FILE"

          echo "Idle signal — idle: $idle, open PRs: $open_prs, active pipeline issues: $active_pipeline_issues"

      - name: Dispatch observation loop on idle
        if: env.CIRCUIT_BREAKER_TRIPPED != 'true'
        env:
          GH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: |
          STATE_FILE="company/pipeline-health-state.json"
          now=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          idle=$(jq -r '.idle_signal.idle // false' "$STATE_FILE")
          last_dispatch=$(jq -r '.idle_signal.last_dispatch_at // ""' "$STATE_FILE")

          if [ "$idle" != "true" ]; then
            echo "Pipeline is not idle — skipping observation-loop dispatch"
            exit 0
          fi

          cooldown_seconds=$((6 * 60 * 60))
          now_epoch=$(date -u +%s)
          last_epoch=0
          if [ -n "$last_dispatch" ]; then
            last_epoch=$(date -u -d "$last_dispatch" +%s 2>/dev/null || date -u -j -f '%Y-%m-%dT%H:%M:%SZ' "$last_dispatch" +%s 2>/dev/null || echo 0)
          fi

          if [ "$last_epoch" -gt 0 ] && [ $((now_epoch - last_epoch)) -lt "$cooldown_seconds" ]; then
            echo "Idle dispatch cooldown active — last dispatch at $last_dispatch"
            exit 0
          fi

          # shellcheck disable=SC2102
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/dispatches" \
            -f event_type='company-signal' \
            -f client_payload[signal]='idle-pipeline' \
            -f client_payload[source]='pipeline-health' \
            -f client_payload[idle_checked_at]="$now"

          jq --arg ts "$now" '.idle_signal.last_dispatch_at = $ts' "$STATE_FILE" > /tmp/state.json && mv /tmp/state.json "$STATE_FILE"
          echo "Dispatched observation loop due to idle pipeline"

      # ── Update state ──────────────────────────────────────────
      - name: Update state summary
        run: |
          STATE_FILE="company/pipeline-health-state.json"
          now=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          new_checks_run=$(( checks_run + 1 ))
          new_healed=$(( issues_healed_total + ACTIONS_TAKEN ))

          # Preserve existing retry_tracker and signals from check steps
          existing_retry_tracker=$(jq '.retry_tracker // {}' "$STATE_FILE")
          existing_funnel_signals=$(jq '.funnel_signals // {}' "$STATE_FILE")
          existing_idle_signal=$(jq '.idle_signal // {}' "$STATE_FILE")
          existing_consecutive_no_mutation_runs=$(jq '.consecutive_no_mutation_runs // 0' "$STATE_FILE")

          jq -n \
            --arg last_check "$now" \
            --argjson check_interval_hours 0.5 \
            --argjson checks_run "$new_checks_run" \
            --argjson issues_healed_total "$new_healed" \
            --argjson consecutive_no_mutation_runs "$existing_consecutive_no_mutation_runs" \
            --argjson retry_tracker "$existing_retry_tracker" \
            --argjson funnel_signals "$existing_funnel_signals" \
            --argjson idle_signal "$existing_idle_signal" \
            --argjson stale_triage "$STALE_TRIAGE_FOUND" \
            --argjson stale_copilot "$STALE_COPILOT_FOUND" \
            --argjson stale_approved "$STALE_APPROVED_FOUND" \
            --argjson needs_human "$NEEDS_HUMAN_CLOSED" \
            --argjson actions "$ACTIONS_TAKEN" \
            --argjson errors "$ERRORS" \
            '{
              last_check: $last_check,
              check_interval_hours: $check_interval_hours,
              checks_run: $checks_run,
              issues_healed_total: $issues_healed_total,
              consecutive_no_mutation_runs: $consecutive_no_mutation_runs,
              retry_tracker: $retry_tracker,
              funnel_signals: $funnel_signals,
              idle_signal: $idle_signal,
              last_run_summary: {
                stale_triage_found: $stale_triage,
                stale_copilot_found: $stale_copilot,
                stale_approved_found: $stale_approved,
                needs_human_closed: $needs_human,
                actions_taken: $actions,
                errors: $errors
              }
            }' > "$STATE_FILE"

      - name: Assert state mutation
        if: always() && hashFiles('.github/scripts/assert-state-mutation.sh') != ''
        continue-on-error: true
        id: assert_mutation
        env:
          STATE_FILE: ${{ env.STATE_FILE }}
          PRE_RUN_LAST_CHECK: ${{ env.PRE_RUN_LAST_CHECK }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          bash .github/scripts/assert-state-mutation.sh \
            "$PRE_RUN_LAST_CHECK" \
            "$(jq -r '.last_check // ""' "$STATE_FILE")"

      # ── Sanitise before commit ────────────────────────────────
      - name: Sanitise before commit
        run: |
          cat company/pipeline-health-state.json | bash company/scripts/sanitise.sh > /dev/null
          if [ -s company/audit-log.jsonl ]; then
            cat company/audit-log.jsonl | bash company/scripts/sanitise.sh > /dev/null
          fi

      # ── Commit state via PR ───────────────────────────────────
      - name: Commit state via PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config user.name "pipeline-health[bot]"
          git config user.email "pipeline-health[bot]@users.noreply.github.com"
          git add company/pipeline-health-state.json company/audit-log.jsonl
          git diff --cached --quiet && echo "No changes to commit" && exit 0

          today=$(date -u '+%Y-%m-%d')
          branch="pipeline-health/${today}-${GITHUB_RUN_ID}"
          git checkout -b "$branch" origin/main
          git commit -m "heal: pipeline health check $today"
          git push -u origin "$branch"

          pr_url=$(gh pr create \
            --title "heal: pipeline health check $today" \
            --body "Automated state update from pipeline-health workflow." \
            --base main \
            --head "$branch")

          pr_number=$(echo "$pr_url" | grep -o '[0-9]*$')
          echo "Created PR #${pr_number}"

          # Review-merge handled by bot-pr-review-merge.yml workflow

      - name: Fail if state mutation assertion failed
        if: always() && steps.assert_mutation.outcome == 'failure'
        run: |
          echo "::error::State mutation assertion failed — supervisor may be clogged"
          exit 1

      - name: Fail if any stale-detection query failed
        if: always() && (steps.stale_triage.outcome == 'failure' || steps.stale_copilot.outcome == 'failure' || steps.stale_approved.outcome == 'failure')
        run: |
          echo "::error::one or more stale-detection queries failed — heal incomplete this run"
          exit 1

      - name: Append pipeline-health outcome to MentisDB
        if: always()
        env:
          MENTISDB_URL: ${{ secrets.MENTISDB_URL }}
          MENTISDB_USER: ${{ secrets.MENTISDB_USER }}
          MENTISDB_PASSWORD: ${{ secrets.MENTISDB_PASSWORD }}
          OUTCOME: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          case "$OUTCOME" in
            success)   TYPE="Insight";  IMP="0.4" ;;
            failure)   TYPE="Mistake";  IMP="0.7" ;;
            cancelled) TYPE="Mistake";  IMP="0.5" ;;
            *)         TYPE="Mistake";  IMP="0.6" ;;
          esac
          STATE_SUMMARY=$(jq -r '"actions=" + (.actions_taken|tostring) + " errors=" + (.errors|tostring) + " stale_prs=" + (.stale_prs_closed|tostring) + " needs_human_closed=" + (.needs_human_closed|tostring)' company/pipeline-health-state.json 2>/dev/null || echo "state-unavailable")
          PAYLOAD=$(jq -nc \
            --arg type "$TYPE" \
            --arg outcome "$OUTCOME" \
            --arg run_url "$RUN_URL" \
            --arg state "$STATE_SUMMARY" \
            --arg imp "$IMP" \
            '{
              chain_key: "ai-pipeline-template",
              agent_id: "pipeline-health",
              agent_name: "pipeline-health",
              thought_type: $type,
              content: ("Pipeline self-heal cycle " + $outcome + " — " + $state + " (" + $run_url + ")"),
              tags: ["ai-pipeline-template", "pipeline-health", $outcome],
              importance: ($imp | tonumber)
            }')
          URL="${MENTISDB_URL%/}/v1/thoughts"
          curl --fail-with-body --silent --show-error --max-time 15 \
            -u "$MENTISDB_USER:$MENTISDB_PASSWORD" \
            -X POST -H 'Content-Type: application/json' \
            -d "$PAYLOAD" "$URL" \
            || { code=$?; echo "::warning::mentisdb append failed (curl exit $code, non-fatal)"; }

      - name: Emit pipeline_health_run to PostHog
        if: always()
        env:
          POSTHOG_PROJECT_KEY: ${{ secrets.POSTHOG_PROJECT_KEY }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
          OUTCOME: ${{ job.status }}
        run: |
          # The "Commit state via PR" step earlier switched to a
          # pipeline-health/<date>-<run-id> branch which predates this
          # helper script. Path-restricted checkout pulls just the helper
          # from main without changing branch state.
          git checkout main -- company/scripts/posthog-emit.sh 2>/dev/null || true
          PROPS=$(jq -nc \
            --arg outcome "$OUTCOME" \
            --argjson actions "${ACTIONS_TAKEN:-0}" \
            --argjson errors "${ERRORS:-0}" \
            --argjson stale_triage "${STALE_TRIAGE_FOUND:-0}" \
            --argjson stale_copilot "${STALE_COPILOT_FOUND:-0}" \
            --argjson stale_approved "${STALE_APPROVED_FOUND:-0}" \
            --argjson needs_human_closed "${NEEDS_HUMAN_CLOSED:-0}" \
            --arg circuit_breaker "${CIRCUIT_BREAKER_TRIPPED:-false}" \
            '{outcome: $outcome, actions_taken: $actions, errors: $errors, stale_triage: $stale_triage, stale_copilot: $stale_copilot, stale_approved: $stale_approved, needs_human_closed: $needs_human_closed, circuit_breaker_tripped: ($circuit_breaker == "true")}')
          bash company/scripts/posthog-emit.sh pipeline_health_run "pipeline-health" "$PROPS"
