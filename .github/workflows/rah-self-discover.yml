name: RAH Self Discover
on: {workflow_dispatch: {}}
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - env:
          K: ${{ secrets.RENTAHUMAN_API_KEY }}
        run: |
          set +e
          A="https://rentahuman.ai/api"
          for ep in "/keys" "/account/status" "/me" "/account" "/agents/me" "/agents" "/bounties/zWFeTTTCYQlLBgIOX6aW"; do
            echo "--- $ep ---"
            curl -sS "$A$ep" -H "X-API-Key: $K" -H "Accept: application/json" -o /tmp/r.json -w "HTTP %{http_code}\n"
            head -c 800 /tmp/r.json
            echo; echo
          done
