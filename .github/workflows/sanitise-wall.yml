name: Sanitise Wall

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check-sanitise-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check LLM emit sanitise gate
        shell: bash
        run: bash scripts/lint/check-llm-emit-sanitise.sh
