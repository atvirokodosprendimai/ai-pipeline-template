name: Sanitise Wall

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check-sanitise-gate:
    # Bot PRs (bot/* heads) skip this standalone Actions run — they are
    # gated at merge by the required impl-judge check (fail-closed safety
    # rubric) plus the required status checks. The leak guard never lapses
    # for ANY class: ci.yml (U10) runs its sanitise job on every PR and push.
    if: github.event_name != 'pull_request' || !startsWith(github.event.pull_request.head.ref, 'bot/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check LLM emit sanitise gate
        shell: bash
        run: bash scripts/lint/check-llm-emit-sanitise.sh
