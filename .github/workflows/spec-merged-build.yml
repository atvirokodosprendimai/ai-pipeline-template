name: Spec Merged — Trigger Build

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  trigger-build:
    if: >-
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.title, 'spec:')
    runs-on: ubuntu-latest
    steps:
      - name: Assign build agent to implement spec
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.PUSH_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const issueMatch = pr.title.match(/Issue #(\d+)/);
            if (!issueMatch) {
              core.warning('No issue number in spec PR title: ' + pr.title);
              return;
            }
            const issueNumber = parseInt(issueMatch[1], 10);
            const specFile = `specs/issue-${issueNumber}-spec.md`;

            try {
              await github.request('POST /repos/{owner}/{repo}/issues/{issue_number}/assignees', {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                assignees: ['copilot-swe-agent[bot]'],
                agent_assignment: {
                  custom_instructions: [
                    `The spec for issue #${issueNumber} has been approved and merged.`,
                    `Read the spec at ${specFile} and implement it.`,
                    `Open a PR with the implementation. Include "Issue #${issueNumber}" in the PR title.`,
                    `Write tests. Follow the project conventions in CLAUDE.md and .goosehints.`,
                  ].join('\n'),
                },
                headers: { 'X-GitHub-Api-Version': '2022-11-28' },
              });
            } catch (e) {
              core.setFailed(`Failed to assign build agent: ${e.message}`);
              return;
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: issueNumber, labels: ['building']
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: issueNumber,
              body: `Spec merged (PR #${pr.number}). Build agent assigned to implement.`
            });

      - name: Append spec-merge-build outcome to MentisDB
        if: always()
        env:
          MENTISDB_URL: ${{ secrets.MENTISDB_URL }}
          MENTISDB_USER: ${{ secrets.MENTISDB_USER }}
          MENTISDB_PASSWORD: ${{ secrets.MENTISDB_PASSWORD }}
          OUTCOME: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          case "$OUTCOME" in
            success)   TYPE="ActionTaken"; IMP="0.5" ;;
            failure)   TYPE="Mistake";     IMP="0.7" ;;
            cancelled) TYPE="Mistake";     IMP="0.5" ;;
            *)         TYPE="Mistake";     IMP="0.6" ;;
          esac
          PAYLOAD=$(jq -nc \
            --arg type "$TYPE" \
            --arg outcome "$OUTCOME" \
            --arg run_url "$RUN_URL" \
            --arg pr "$PR_NUMBER" \
            --arg title "$PR_TITLE" \
            --arg imp "$IMP" \
            '{
              chain_key: "ai-pipeline-template",
              agent_id: "spec-merged-build",
              agent_name: "spec-merged-build",
              thought_type: $type,
              content: ("Spec PR #" + $pr + " (" + $title + ") merged — build dispatch " + $outcome + " (" + $run_url + ")"),
              tags: ["ai-pipeline-template", "spec-merge-build", $outcome],
              importance: ($imp | tonumber)
            }')
          curl --fail-with-body --silent --show-error --max-time 15 \
            -u "$MENTISDB_USER:$MENTISDB_PASSWORD" \
            -X POST -H 'Content-Type: application/json' \
            -d "$PAYLOAD" "$MENTISDB_URL/v1/thoughts" \
            || echo "::warning::mentisdb append failed (non-fatal)"
