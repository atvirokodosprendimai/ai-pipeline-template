name: RAH Application Decide (write)

# workflow_dispatch utility to accept/reject a RAH application or send a
# conversation message. WRITE actions — gated by manual dispatch only.
#
# Auth: X-API-Key header with org secret RENTAHUMAN_API_KEY (verified-class
# agent key, paired 2026-05-08T21:27Z).
#
# Endpoints reverse-engineered from rentahuman-mcp@1.11.7 (npm tarball)
# 2026-05-10:
#   accept/reject: PATCH /api/bounties/{bid}/applications/{aid}
#                  body: {action: "accept"|"reject", response: <reason>}
#   message:       POST /api/conversations/{cid}/messages
#                  body: {content: <body>}
#
# Validation: a 200 with HTML body (Next.js SPA fallthrough) is NOT
# success. Probe rejects responses lacking application/json Content-Type.

on:
  workflow_dispatch:
    inputs:
      action:
        description: accept | reject | message
        required: true
        type: choice
        options: [accept, reject, message]
      bounty_id:
        description: Bounty ID (required for accept/reject)
        required: false
        default: ''
      application_id:
        description: Application ID (required for accept/reject)
        required: false
        default: ''
      conversation_id:
        description: Conversation ID (required for message)
        required: false
        default: ''
      reason:
        description: Reject reason (reject) / message body (message) / accept response (accept)
        required: false
        default: ''

permissions:
  contents: read

jobs:
  decide:
    runs-on: ubuntu-latest
    steps:
      - name: Execute action via RAH REST
        env:
          RAH_KEY: ${{ secrets.RENTAHUMAN_API_KEY }}
          ACTION: ${{ inputs.action }}
          BOUNTY: ${{ inputs.bounty_id }}
          APP: ${{ inputs.application_id }}
          CONV: ${{ inputs.conversation_id }}
          REASON: ${{ inputs.reason }}
        run: |
          set -uo pipefail
          if [ -z "${RAH_KEY:-}" ]; then
            echo "::error::RENTAHUMAN_API_KEY missing"
            exit 1
          fi
          API="https://rentahuman.ai/api"

          # call <method> <path> <body_json>; exits 1 if not 2xx JSON
          call() {
            local method="$1"; local path="$2"; local body="$3"
            echo "--- ${method} ${path} ---"
            local code ct
            code=$(curl -sS -o /tmp/r.body -D /tmp/r.hdr -w "%{http_code}" \
              -X "$method" "${API}${path}" \
              -H "X-API-Key: ${RAH_KEY}" \
              -H "Accept: application/json" \
              -H "Content-Type: application/json" \
              -d "$body")
            ct=$(grep -i '^content-type:' /tmp/r.hdr | head -1 | tr -d '\r')
            echo "HTTP $code  ${ct}"
            if echo "$ct" | grep -qi 'application/json'; then
              jq '.' /tmp/r.body
            else
              echo "(non-JSON body, first 200 chars:)"
              head -c 200 /tmp/r.body; echo
            fi
            if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
              echo "::error::HTTP $code"
              return 1
            fi
            if ! echo "$ct" | grep -qi 'application/json'; then
              echo "::error::Response is not JSON (Content-Type: $ct) — likely SPA fallthrough, route does not exist"
              return 1
            fi
            # Final check: server may 200 with {success:false, error:...}
            local errmsg
            errmsg=$(jq -r 'if (.error // .errorMessage // .errorCode) then (.error // .errorMessage // .errorCode) else empty end' /tmp/r.body 2>/dev/null)
            if [ -n "$errmsg" ]; then
              echo "::error::API returned error: $errmsg"
              return 1
            fi
            return 0
          }

          case "$ACTION" in
            accept|reject)
              if [ -z "$BOUNTY" ] || [ -z "$APP" ]; then
                echo "::error::accept/reject requires bounty_id + application_id"
                exit 1
              fi
              BODY=$(jq -nc --arg a "$ACTION" --arg r "$REASON" '{action: $a, response: $r}')
              if call PATCH "/bounties/${BOUNTY}/applications/${APP}" "$BODY"; then
                echo "## ${ACTION} OK" >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              exit 1
              ;;
            message)
              if [ -z "$CONV" ] || [ -z "$REASON" ]; then
                echo "::error::message requires conversation_id + reason (= message body)"
                exit 1
              fi
              BODY=$(jq -nc --arg c "$REASON" '{content: $c}')
              if call POST "/conversations/${CONV}/messages" "$BODY"; then
                echo "## message sent" >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              exit 1
              ;;
            *)
              echo "::error::unknown action: $ACTION"
              exit 1
              ;;
          esac
