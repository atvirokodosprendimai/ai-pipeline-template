name: Langfuse Ingestion Probe

# Gitops health probe for the self-hosted Langfuse: confirms scores/traces
# actually land (no 400 server-side) using the LANGFUSE_* secrets. Surfaces the
# "are our scores erroring?" answer without SSH to the Langfuse box. Creates a
# couple of isolated probe-session scores (harmless test data).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Validate secrets
        env:
          LANGFUSE_HOST: ${{ secrets.LANGFUSE_HOST }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
        run: |
          set -euo pipefail
          : "${LANGFUSE_HOST:?}"; : "${LANGFUSE_PUBLIC_KEY:?}"; : "${LANGFUSE_SECRET_KEY:?}"

      - name: Probe Langfuse ingestion
        env:
          LANGFUSE_HOST: ${{ secrets.LANGFUSE_HOST }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
        run: |
          python - <<'PY'
          import os, base64, json, urllib.request, urllib.error

          host = os.environ["LANGFUSE_HOST"].rstrip("/")
          pk = os.environ["LANGFUSE_PUBLIC_KEY"]
          sk = os.environ["LANGFUSE_SECRET_KEY"]
          auth = base64.b64encode(f"{pk}:{sk}".encode()).decode()

          def call(method, path, body=None, full=False):
              # full=True: return the whole body — list endpoints exceed 800
              # chars and a truncated body parses as "unparseable", which read
              # as "no traces" during the 2026-06-10 no-sessions investigation.
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(
                  host + path, method=method, data=data,
                  headers={"Authorization": "Basic " + auth,
                           "Content-Type": "application/json"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=25) as r:
                      text = r.read().decode()
                      return r.status, text if full else text[:800]
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode()[:800]
              except Exception as e:
                  return None, repr(e)

          print("=== health ===")
          print(call("GET", "/api/public/health"))

          print("\n=== POST session-linked score (expect 2xx — mirrors #1562 fix) ===")
          print(call("POST", "/api/public/scores", {
              "name": "probe_session_linked", "value": 1, "dataType": "NUMERIC",
              "sessionId": "probe-session"}))

          print("\n=== POST no-link score (expect 400 — the dormant bug shape) ===")
          print(call("POST", "/api/public/scores", {
              "name": "probe_no_link", "value": 1, "dataType": "NUMERIC"}))

          print("\n=== GET recent scores (are the box's pipeline_outcome/auto_merged landing?) ===")
          status, bodytext = call("GET", "/api/public/scores?limit=10", full=True)
          print("status:", status)
          try:
              data = json.loads(bodytext)
              print("  total:", data.get("meta", {}).get("totalItems"))
              for s in data.get("data", [])[:10]:
                  print(f"  - {s.get('timestamp')} {s.get('name')} = {s.get('value')} "
                        f"session={s.get('sessionId')} type={s.get('dataType')}")
          except Exception:
              print("  (unparseable response; status above — body withheld to avoid re-logging old trace inputs)")

          print("\n=== GET recent traces (sessions wired?) ===")
          status, bodytext = call("GET", "/api/public/traces?limit=10", full=True)
          print("status:", status)
          try:
              data = json.loads(bodytext)
              print("  total:", data.get("meta", {}).get("totalItems"))
              for t in data.get("data", [])[:10]:
                  print(f"  - {t.get('timestamp')} {t.get('name')} session={t.get('sessionId')}")
          except Exception:
              print("  (unparseable response; status above — body withheld to avoid re-logging old trace inputs)")

          print("\n=== GET sessions (UI sessions click errors — server-side or UI-side?) ===")
          status, bodytext = call("GET", "/api/public/sessions?limit=10", full=True)
          print("status:", status)
          try:
              data = json.loads(bodytext)
              print("  total:", data.get("meta", {}).get("totalItems"))
              for s in data.get("data", [])[:10]:
                  print(f"  - {s.get('createdAt')} id={s.get('id')}")
          except Exception:
              print("  body head:", bodytext[:300])

          print("\n=== GET single session detail (UI byIdWithScores 404s — does public API?) ===")
          status, bodytext = call("GET", "/api/public/sessions/issue-510", full=True)
          print("status:", status)
          try:
              data = json.loads(bodytext)
              print("  id:", data.get("id"), "traces:", len(data.get("traces", [])))
          except Exception:
              print("  body head:", bodytext[:300])
          PY
