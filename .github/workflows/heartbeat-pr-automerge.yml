name: Heartbeat PR Auto-Merge

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: heartbeat-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  validate-and-merge:
    if: >-
      (startsWith(github.event.pull_request.title, 'loop: ') ||
       startsWith(github.event.pull_request.title, 'heal: ') ||
       startsWith(github.event.pull_request.title, 'audit: strategy baseline')) &&
      !contains(github.event.pull_request.labels.*.name, 'needs-human')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          token: ${{ secrets.PUSH_TOKEN }}
          fetch-depth: 0

      - name: Validate heartbeat PR scope
        env:
          GH_TOKEN: ${{ secrets.PUSH_TOKEN }}
          TARGET_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          set -euo pipefail

          if [ "$PR_HEAD_REPO" != "$TARGET_REPO" ]; then
            echo "::error::Heartbeat PR head repo '$PR_HEAD_REPO' does not match target repo '$TARGET_REPO'"
            exit 1
          fi

          if [ "$PR_IS_FORK" = "true" ]; then
            echo "::error::Heartbeat PR originates from a fork, which is not allowed for heartbeat fast lane"
            exit 1
          fi

          case "$PR_AUTHOR" in
            github-actions[bot]|copilot-swe-agent[bot]|goose[bot])
              echo "Heartbeat PR author allowed explicitly: $PR_AUTHOR"
              ;;
            *)
              echo "::warning::Heartbeat PR author '$PR_AUTHOR' is not in the explicit bot allowlist; proceeding because same-repo + branch + file-scope checks passed"
              ;;
          esac

          changed_files=()
          while IFS= read -r path; do
            [ -n "$path" ] && changed_files+=("$path")
          done < <(gh pr view "$PR_NUMBER" --repo "$TARGET_REPO" --json files --jq '.files[].path')

          if [ "${#changed_files[@]}" -eq 0 ]; then
            echo "::error::Heartbeat PR has no changed files"
            exit 1
          fi

          case "$PR_TITLE" in
            loop:*)
              expected_branch='^loop/assessment-'
              ;;
            heal:*)
              expected_branch='^pipeline-health/'
              ;;
            'audit: strategy baseline'*)
              expected_branch='^audit/strategy-baseline-'
              ;;
            *)
              echo "::error::PR title does not match heartbeat prefixes: $PR_TITLE"
              exit 1
              ;;
          esac

          if ! echo "$PR_HEAD_REF" | grep -Eq "$expected_branch"; then
            echo "::error::Heartbeat PR branch '$PR_HEAD_REF' does not match expected pattern '$expected_branch'"
            exit 1
          fi

          for path in "${changed_files[@]}"; do
            case "$path" in
              company/loop-state.json|company/pipeline-health-state.json|company/audit-log.jsonl|company/strategy-audit-baseline.json)
                ;;
              company/loop-history/*.md)
                ;;
              *)
                echo "::error::Heartbeat PR touches out-of-scope file: $path"
                exit 1
                ;;
            esac
          done

          total_lines=$(gh pr view "$PR_NUMBER" --repo "$TARGET_REPO" --json additions,deletions --jq '.additions + .deletions')
          if [ "$total_lines" -gt 1000 ]; then
            echo "::error::Heartbeat PR exceeds size limit: ${total_lines} lines > 1000"
            exit 1
          fi

      - name: Validate JSON and JSONL files
        env:
          GH_TOKEN: ${{ secrets.PUSH_TOKEN }}
          TARGET_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          changed_files=()
          while IFS= read -r path; do
            [ -n "$path" ] && changed_files+=("$path")
          done < <(gh pr view "$PR_NUMBER" --repo "$TARGET_REPO" --json files --jq '.files[].path')

          for path in "${changed_files[@]}"; do
            case "$path" in
              company/loop-state.json|company/pipeline-health-state.json|company/strategy-audit-baseline.json)
                jq empty "$path"
                ;;
              company/audit-log.jsonl)
                while IFS= read -r line; do
                  [ -z "$line" ] && continue
                  echo "$line" | jq -e . >/dev/null
                done < "$path"
                ;;
            esac
          done

      - name: Sanitise changed files
        env:
          GH_TOKEN: ${{ secrets.PUSH_TOKEN }}
          TARGET_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          changed_files=()
          while IFS= read -r path; do
            [ -n "$path" ] && changed_files+=("$path")
          done < <(gh pr view "$PR_NUMBER" --repo "$TARGET_REPO" --json files --jq '.files[].path')

          for path in "${changed_files[@]}"; do
            if [ -f "$path" ]; then
              bash company/scripts/sanitise.sh < "$path" > /dev/null
            else
              echo "::error::Changed file missing from checkout: $path"
              exit 1
            fi
          done

      - name: Merge heartbeat PR (admin bypass, retry on race)
        env:
          GH_TOKEN: ${{ secrets.PUSH_TOKEN }}
          TARGET_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          attempts=0
          max_attempts=5
          while [ "$attempts" -lt "$max_attempts" ]; do
            attempts=$((attempts + 1))
            if out=$(gh pr merge "$PR_NUMBER" --repo "$TARGET_REPO" --squash --delete-branch --admin 2>&1); then
              echo "Merged PR #$PR_NUMBER on attempt $attempts"
              exit 0
            fi
            echo "$out"
            if echo "$out" | grep -qiE "Merge already in progress|merge_in_progress|Pull Request is in unstable status|Base branch was modified"; then
              backoff=$((attempts * 10))
              echo "::notice::Transient merge race on attempt $attempts; retrying in ${backoff}s"
              sleep "$backoff"
              continue
            fi
            echo "::error::gh pr merge failed with non-retryable error (full output above)"
            exit 1
          done
          echo "::error::gh pr merge exhausted $max_attempts attempts"
          exit 1

      - name: Comment on validation failure
        if: failure()
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.PUSH_TOKEN }}
          script: |
            const prNumber = context.payload.pull_request.number;
            const body = [
              'Heartbeat fast-lane validation failed for this PR.',
              '',
              'This PR was not auto-merged. Check the failed workflow step for the exact reason.',
              '',
              'Validation gates:',
              '- same-repo only (no forks)',
              '- allowed bot author only',
              '- expected branch naming',
              '- heartbeat file-scope only',
              '- size <= 1000 changed lines',
              '- valid JSON/JSONL',
              '- sanitisation passes'
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body,
            });

            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                labels: ['needs-human']
              });
            } catch (e) {
              core.warning(`Failed to add needs-human label: ${e.message}`);
            }

      - name: Append heartbeat-merge outcome to MentisDB
        if: always()
        env:
          MENTISDB_URL: ${{ secrets.MENTISDB_URL }}
          MENTISDB_USER: ${{ secrets.MENTISDB_USER }}
          MENTISDB_PASSWORD: ${{ secrets.MENTISDB_PASSWORD }}
          OUTCOME: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          case "$OUTCOME" in
            success)   TYPE="TaskComplete"; IMP="0.7" ;;
            failure)   TYPE="Mistake";      IMP="0.8" ;;
            cancelled) TYPE="Mistake";      IMP="0.6" ;;
            *)         TYPE="Mistake";      IMP="0.7" ;;
          esac
          PAYLOAD=$(jq -nc \
            --arg type "$TYPE" \
            --arg outcome "$OUTCOME" \
            --arg run_url "$RUN_URL" \
            --arg pr "$PR_NUMBER" \
            --arg title "$PR_TITLE" \
            --arg imp "$IMP" \
            '{
              chain_key: "ai-pipeline-template",
              agent_id: "heartbeat-pr-automerge",
              agent_name: "heartbeat-pr-automerge",
              thought_type: $type,
              content: ("Heartbeat PR #" + $pr + " (" + $title + ") — fast-lane " + $outcome + " (" + $run_url + ")"),
              tags: ["ai-pipeline-template", "heartbeat-merge", $outcome],
              importance: ($imp | tonumber)
            }')
          URL="${MENTISDB_URL%/}/v1/thoughts"
          curl --fail-with-body --silent --show-error --max-time 15 \
            -u "$MENTISDB_USER:$MENTISDB_PASSWORD" \
            -X POST -H 'Content-Type: application/json' \
            -d "$PAYLOAD" "$URL" \
            || { code=$?; echo "::warning::mentisdb append failed (curl exit $code, non-fatal)"; }
