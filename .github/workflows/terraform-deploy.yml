name: Terraform Infrastructure Deployment

on:
  push:
    paths:
      - 'infrastructure/terraform/**'
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  pipeline:
    name: 'OpenTofu Apply (pipeline)'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: infrastructure/terraform/pipeline
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.8.5

      - name: Generate backend config
        run: |
          cat > backend.hcl <<EOF
          bucket = "${{ secrets.TOFU_STATE_BUCKET }}"
          region = "${{ secrets.TOFU_STATE_REGION }}"
          endpoints = { s3 = "${{ secrets.TOFU_STATE_ENDPOINT }}" }
          key = "pipeline/terraform.tfstate"
          access_key = "${{ secrets.TOFU_STATE_ACCESS_KEY }}"
          secret_key = "${{ secrets.TOFU_STATE_SECRET_KEY }}"
          skip_credentials_validation = true
          skip_metadata_api_check     = true
          skip_region_validation      = true
          skip_requesting_account_id  = true
          skip_s3_checksum            = true
          use_path_style              = true
          EOF

      - name: Tofu Init
        run: tofu init -backend-config=backend.hcl

      - name: Tofu Plan
        id: plan
        run: tofu plan -no-color
        env:
          TF_VAR_github_push_token: ${{ secrets.PUSH_TOKEN }}
          TF_VAR_openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TF_VAR_cloudflare_api_token: ${{ secrets.BEERPUB_CLOUDFLARE_API_TOKEN }}

      - name: Tofu Apply
        if: github.ref == 'refs/heads/main'
        run: tofu apply -auto-approve
        env:
          TF_VAR_github_push_token: ${{ secrets.PUSH_TOKEN }}
          TF_VAR_openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TF_VAR_cloudflare_api_token: ${{ secrets.BEERPUB_CLOUDFLARE_API_TOKEN }}

  mentisdb:
    name: 'OpenTofu Apply (mentisdb)'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: infrastructure/terraform/mentisdb
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.8.5

      - name: Generate backend config
        run: |
          cat > backend.hcl <<EOF
          bucket = "${{ secrets.TOFU_STATE_BUCKET }}"
          region = "${{ secrets.TOFU_STATE_REGION }}"
          endpoints = { s3 = "${{ secrets.TOFU_STATE_ENDPOINT }}" }
          key = "mentisdb/terraform.tfstate"
          access_key = "${{ secrets.TOFU_STATE_ACCESS_KEY }}"
          secret_key = "${{ secrets.TOFU_STATE_SECRET_KEY }}"
          skip_credentials_validation = true
          skip_metadata_api_check     = true
          skip_region_validation      = true
          skip_requesting_account_id  = true
          skip_s3_checksum            = true
          use_path_style              = true
          EOF

      - name: Tofu Init
        run: tofu init -backend-config=backend.hcl

      - name: Tofu Plan
        id: plan
        run: tofu plan -no-color
        env:
          TF_VAR_hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
          TF_VAR_cloudflare_api_token: ${{ secrets.BEERPUB_CLOUDFLARE_API_TOKEN }}
          TF_VAR_deploy_ssh_public_key: ${{ secrets.HETZNER_SSH_PUBLIC_KEY }}
          TF_VAR_beerpub_cloudflare_zone_id: ${{ secrets.BEERPUB_CLOUDFLARE_ZONE_ID }}

      - name: Tofu Apply
        if: github.ref == 'refs/heads/main'
        run: tofu apply -auto-approve
        env:
          TF_VAR_hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
          TF_VAR_cloudflare_api_token: ${{ secrets.BEERPUB_CLOUDFLARE_API_TOKEN }}
          TF_VAR_deploy_ssh_public_key: ${{ secrets.HETZNER_SSH_PUBLIC_KEY }}
          TF_VAR_beerpub_cloudflare_zone_id: ${{ secrets.BEERPUB_CLOUDFLARE_ZONE_ID }}
