name: Terraform Infrastructure Deployment

on:
  push:
    paths:
      - 'infrastructure/terraform/**'
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    name: 'Terraform Apply'
    runs-on: ubuntu-latest
    environment: production

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.5.7

    - name: Configure Cloudflare Credentials
      run: |
        echo "CLOUDFLARE_API_TOKEN=${{ secrets.CLOUDFLARE_API_TOKEN }}" >> $GITHUB_ENV

    - name: Terraform Init
      id: init
      run: terraform init
      working-directory: infrastructure/terraform

    - name: Terraform Plan
      id: plan
      run: terraform plan -no-color
      working-directory: infrastructure/terraform
      continue-on-error: true
      env:
        TF_VAR_github_push_token: ${{ secrets.PUSH_TOKEN }}
        TF_VAR_openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
        TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        TF_VAR_beerpub_cloudflare_zone_id: ${{ secrets.BEERPUB_CLOUDFLARE_ZONE_ID }}
        TF_VAR_deploy_ssh_public_key: ${{ secrets.DEPLOY_SSH_PUBLIC_KEY }}
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}

    - name: Terraform Apply
      if: github.ref == 'refs/heads/main' && steps.plan.outcome == 'success'
      run: terraform apply -auto-approve
      working-directory: infrastructure/terraform
      env:
        TF_VAR_github_push_token: ${{ secrets.PUSH_TOKEN }}
        TF_VAR_openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
        TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        TF_VAR_beerpub_cloudflare_zone_id: ${{ secrets.BEERPUB_CLOUDFLARE_ZONE_ID }}
        TF_VAR_deploy_ssh_public_key: ${{ secrets.DEPLOY_SSH_PUBLIC_KEY }}
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}

    - name: Update Pipeline Dashboard
      if: success()
      run: |
        echo "Infrastructure deployed successfully"
        echo "Dashboard URL: https://chimney.beerpub.dev/pipeline"
        echo "Repository: ${{ github.repository }}"
