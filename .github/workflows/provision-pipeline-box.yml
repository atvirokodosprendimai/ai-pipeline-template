name: Provision Pipeline Box

# One-shot: provision a dedicated Hetzner VM and bring the wgmesh-pipeline up in
# shadow mode. Runs here because HCLOUD_TOKEN is an org secret (GitHub secrets
# are write-only — they can't be read locally). Runtime secrets are written to
# the box OVER SSH, never via cloud-init user-data (which lands in Hetzner
# metadata/logs).
#
# Required secrets (org or this repo):
#   HCLOUD_TOKEN          (org)  — Hetzner project to bill/host
#   ZAI_API_KEY                  — Goose LLM (z.ai)
#   TURSO_DATABASE_URL          — durable state (when database_mode=turso)
#   TURSO_AUTH_TOKEN
# wgmesh is PUBLIC, so shadow needs no GitHub token (reads only). Live (later)
# needs WGMESH_BOT_PAT.

on:
  workflow_dispatch:
    inputs:
      server_name:
        description: 'Hetzner server name'
        default: 'wgmesh-pipeline'
      server_type:
        description: 'Hetzner server type'
        default: 'cx22'
      location:
        description: 'Hetzner location'
        default: 'hel1'
      pipeline_mode:
        description: 'PIPELINE_MODE (start in shadow)'
        default: 'shadow'
      database_mode:
        description: 'DATABASE_MODE (local|turso)'
        default: 'turso'
      reset_queue:
        description: 'Clear durable pipeline queue/runs before polling'
        type: boolean
        default: false
      poll_interval:
        description: 'POLL_INTERVAL_SECONDS (seconds between ticks)'
        default: '300'

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    env:
      NAME: ${{ github.event.inputs.server_name }}
    steps:
      - name: Checkout (repo URL used by deploy on the box)
        uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          set -euo pipefail
          : "${HCLOUD_TOKEN:?HCLOUD_TOKEN secret missing (org)}"
          # ANTHROPIC_API_KEY is the z.ai/GLM key for Goose (the box env var
          # ZAI_API_KEY is sourced from it).
          : "${ANTHROPIC_API_KEY:?ANTHROPIC_API_KEY secret missing (the z.ai key)}"
          if [ "${{ github.event.inputs.database_mode }}" = "turso" ]; then
            : "${TURSO_DATABASE_URL:?TURSO_DATABASE_URL missing for database_mode=turso}"
            : "${TURSO_AUTH_TOKEN:?TURSO_AUTH_TOKEN missing for database_mode=turso}"
          fi
          # spec-only and live perform real GitHub writes — require a wgmesh
          # write token. shadow reads only (wgmesh is public) and needs none.
          if [ "${{ github.event.inputs.pipeline_mode }}" != "shadow" ]; then
            : "${WGMESH_BOT_PAT:?WGMESH_BOT_PAT required for pipeline_mode=${{ github.event.inputs.pipeline_mode }} (real writes)}"
          fi
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          WGMESH_BOT_PAT: ${{ secrets.WGMESH_BOT_PAT }}

      - name: Install hcloud CLI
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/hetznercloud/cli/releases/latest/download/hcloud-linux-amd64.tar.gz \
            | tar xz hcloud
          sudo mv hcloud /usr/local/bin/

      - name: Generate ephemeral SSH key (per run)
        run: |
          set -euo pipefail
          ssh-keygen -t ed25519 -N '' -f "$RUNNER_TEMP/box_key" -C "provision-${{ github.run_id }}"
          chmod 600 "$RUNNER_TEMP/box_key"

      - name: Create server
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          SSH_PUBKEY: ${{ secrets.SSH_PUBKEY }}
        run: |
          set -euo pipefail
          echo "::group::available server types"; hcloud server-type list || true; echo "::endgroup::"
          echo "::group::available locations"; hcloud location list || true; echo "::endgroup::"
          KEYNAME="prov-${{ github.run_id }}"
          hcloud ssh-key create --name "$KEYNAME" --public-key-from-file "$RUNNER_TEMP/box_key.pub"
          # Persistent operator key so the box stays reachable after the run.
          SSHKEYS="$KEYNAME"
          if [ -n "${SSH_PUBKEY:-}" ]; then
            printf '%s\n' "$SSH_PUBKEY" > "$RUNNER_TEMP/op.pub"
            hcloud ssh-key describe op-persistent >/dev/null 2>&1 || \
              hcloud ssh-key create --name op-persistent --public-key-from-file "$RUNNER_TEMP/op.pub"
            SSHKEYS="$KEYNAME,op-persistent"
          fi
          cat > "$RUNNER_TEMP/cloud-init.yml" <<'CLOUD'
          #cloud-config
          package_update: true
          packages: [git, python3, python3-venv, python3-pip, curl, jq]
          runcmd:
            # Install Goose SYSTEM-WIDE (/usr/local/bin, on PATH for the wgmesh
            # service user) — the default ~/.local/bin lands in root's home and
            # is unreachable by the service + the non-interactive SSH PATH.
            - curl -fsSL https://github.com/block/goose/releases/latest/download/download_cli.sh | HOME=/root GOOSE_BIN_DIR=/usr/local/bin CONFIGURE=false bash
            - install -d -m 700 /etc/wgmesh-pipeline
            - touch /etc/wgmesh-pipeline/.cloud-init-done
          CLOUD
          # Reuse an existing server with this name? Delete first for a clean stand-up.
          hcloud server describe "$NAME" >/dev/null 2>&1 && hcloud server delete "$NAME" || true
          hcloud server create \
            --name "$NAME" \
            --type "${{ github.event.inputs.server_type }}" \
            --image ubuntu-24.04 \
            --location "${{ github.event.inputs.location }}" \
            --ssh-key "$SSHKEYS" \
            --user-data-from-file "$RUNNER_TEMP/cloud-init.yml"
          IP=$(hcloud server ip "$NAME")
          echo "BOX_IP=$IP" >> "$GITHUB_ENV"
          echo "KEYNAME=$KEYNAME" >> "$GITHUB_ENV"

      - name: Wait for SSH + cloud-init
        run: |
          set -euo pipefail
          for i in $(seq 1 40); do
            if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 -i "$RUNNER_TEMP/box_key" \
                 root@"$BOX_IP" 'cloud-init status --wait >/dev/null 2>&1; test -x /usr/local/bin/goose && test -f /etc/wgmesh-pipeline/.cloud-init-done'; then
              echo "box ready"; exit 0
            fi
            sleep 15
          done
          echo "::error::box did not become ready"
          ssh -o StrictHostKeyChecking=no -i "$RUNNER_TEMP/box_key" root@"$BOX_IP" \
            'cloud-init status; ls -l /usr/local/bin/goose 2>&1; tail -n 30 /var/log/cloud-init-output.log' || true
          exit 1

      - name: Write env (over SSH — secrets never touch cloud-init/metadata)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          LANGFUSE_HOST: ${{ secrets.LANGFUSE_HOST }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          WGMESH_BOT_PAT: ${{ secrets.WGMESH_BOT_PAT }}
          MODE: ${{ github.event.inputs.pipeline_mode }}
          DBMODE: ${{ github.event.inputs.database_mode }}
          RESET_QUEUE_INPUT: ${{ github.event.inputs.reset_queue }}
          PINT: ${{ github.event.inputs.poll_interval }}
        run: |
          set -euo pipefail
          RESET_QUEUE=0
          if [ "${RESET_QUEUE_INPUT:-false}" = "true" ]; then RESET_QUEUE=1; fi
          # The pipeline reads ZAI_API_KEY; source it from the ANTHROPIC_API_KEY
          # secret (which holds the z.ai key).
          ssh -o StrictHostKeyChecking=no -i "$RUNNER_TEMP/box_key" root@"$BOX_IP" \
            "umask 077; cat > /etc/wgmesh-pipeline/env" <<EOF
          PIPELINE_MODE=$MODE
          TARGET_REPO=atvirokodosprendimai/wgmesh
          WGMESH_BOT_PAT=$WGMESH_BOT_PAT
          ZAI_API_KEY=$ANTHROPIC_API_KEY
          ANTHROPIC_HOST=https://api.z.ai/api/anthropic
          GOOSE_PROVIDER=anthropic
          GOOSE_MODEL=glm-4.6
          WGMESH_CHECKOUT_PATH=/opt/wgmesh-checkout
          DATABASE_MODE=$DBMODE
          PIPELINE_DB_PATH=/opt/wgmesh-pipeline/state.db
          TURSO_DATABASE_URL=$TURSO_DATABASE_URL
          TURSO_AUTH_TOKEN=$TURSO_AUTH_TOKEN
          LANGFUSE_HOST=$LANGFUSE_HOST
          LANGFUSE_PUBLIC_KEY=$LANGFUSE_PUBLIC_KEY
          LANGFUSE_SECRET_KEY=$LANGFUSE_SECRET_KEY
          POLL_INTERVAL_SECONDS=${PINT:-300}
          MAX_FILES=20
          RESET_QUEUE=$RESET_QUEUE
          EOF

      - name: Deploy + start (shadow)
        run: |
          set -euo pipefail
          REPO_URL="https://github.com/${{ github.repository }}.git"
          ssh -o StrictHostKeyChecking=no -i "$RUNNER_TEMP/box_key" root@"$BOX_IP" \
            "set -euo pipefail
             set -a
             . /etc/wgmesh-pipeline/env
             set +a
             git clone --depth 1 '$REPO_URL' /opt/wgmesh-pipeline || (cd /opt/wgmesh-pipeline && git pull)
             if [ '${{ github.event.inputs.database_mode }}' = 'turso' ]; then EXTRA='[turso,trace]'; else EXTRA='[trace]'; fi
             python3 -m venv /opt/wgmesh-pipeline/.venv
             /opt/wgmesh-pipeline/.venv/bin/pip install -q --upgrade pip
             /opt/wgmesh-pipeline/.venv/bin/pip install -q -e \"/opt/wgmesh-pipeline/pipeline\${EXTRA}\"
             install -m 0644 /opt/wgmesh-pipeline/pipeline/deploy/wgmesh-pipeline.service /etc/systemd/system/
             id wgmesh >/dev/null 2>&1 || useradd --system --home /opt/wgmesh-pipeline --shell /usr/sbin/nologin wgmesh
             rm -rf /opt/wgmesh-checkout
             if [ -n \"\$WGMESH_BOT_PAT\" ]; then
               git clone \"https://x-access-token:\$WGMESH_BOT_PAT@github.com/atvirokodosprendimai/wgmesh.git\" /opt/wgmesh-checkout
             else
               git clone https://github.com/atvirokodosprendimai/wgmesh.git /opt/wgmesh-checkout
             fi
             chown -R wgmesh:wgmesh /opt/wgmesh-pipeline
             chown -R wgmesh:wgmesh /opt/wgmesh-checkout
             systemctl daemon-reload
             systemctl enable --now wgmesh-pipeline
             sleep 5
             systemctl --no-pager status wgmesh-pipeline | head -n 12
             journalctl -u wgmesh-pipeline --no-pager | tail -n 20
             if [ '${{ github.event.inputs.reset_queue }}' = 'true' ]; then
               sed -i 's/^RESET_QUEUE=.*/RESET_QUEUE=0/' /etc/wgmesh-pipeline/env
             fi"

      - name: Capture journal after ticks (diagnostic)
        run: |
          set -euo pipefail
          echo "Waiting ~11min for several poll ticks (interval 300s) to surface any hang/crash..."
          sleep 660
          ssh -o StrictHostKeyChecking=no -i "$RUNNER_TEMP/box_key" root@"$BOX_IP" \
            "set +e
             echo '===== systemctl status ====='
             systemctl --no-pager status wgmesh-pipeline | head -n 15
             echo '===== journalctl (last 120) ====='
             journalctl -u wgmesh-pipeline --no-pager | tail -n 120"

      - name: Cleanup ephemeral hcloud ssh key
        if: always()
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: hcloud ssh-key delete "${KEYNAME:-prov-${{ github.run_id }}}" || true

      - name: Report
        run: echo "Box '$NAME' at $BOX_IP — wgmesh-pipeline started in '${{ github.event.inputs.pipeline_mode }}' mode."
