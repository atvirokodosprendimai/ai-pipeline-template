name: Update Pipeline Box

# Fast in-place deploy (~1 min): git reset to origin/main + pip install +
# service restart over SSH. Use for CODE changes. Full "Provision Pipeline
# Box" (~13 min, server recreate) is still required when the /etc env file
# must change (new secrets, MODEL_REGISTRY/STAGE_ROUTING edits, mode flips)
# or the box is gone/broken.
#
# Auth: DEPLOY_SSH_KEY secret (dedicated deploy keypair); its public half is
# installed at provision time (vars.DEPLOY_SSH_PUBKEY) and was hand-added to
# the current box 2026-06-10.

on:
  workflow_dispatch:
    inputs:
      server_name:
        description: 'Hetzner server name'
        default: 'wgmesh-pipeline'
  # Reusable so Auto Deploy on Merge can git-reset the box to a green main.
  workflow_call:
    inputs:
      server_name:
        description: 'Hetzner server name'
        default: 'wgmesh-pipeline'
        type: string

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Validate secrets
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: |
          set -euo pipefail
          : "${DEPLOY_SSH_KEY:?DEPLOY_SSH_KEY secret missing}"
          : "${HCLOUD_TOKEN:?HCLOUD_TOKEN secret missing (org)}"

      - name: Install hcloud CLI
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/hetznercloud/cli/releases/latest/download/hcloud-linux-amd64.tar.gz \
            | tar xz hcloud
          sudo mv hcloud /usr/local/bin/

      - name: Resolve box IP
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: |
          set -euo pipefail
          IP=$(hcloud server ip "${{ inputs.server_name }}")
          echo "BOX_IP=$IP" >> "$GITHUB_ENV"

      - name: Update + restart
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/deploy_key"
          # UserKnownHostsFile=/dev/null: provision recreates the server, which
          # rotates the host key; the deploy key is the real gate.
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -o ConnectTimeout=15 -i "$RUNNER_TEMP/deploy_key" root@"$BOX_IP" \
            "set -euo pipefail
             # Toolchain self-heal: a box recreated from an older provision may
             # lack Go (2026-06-10: a 70s install race cost two gate decisions
             # 'go binary not found'). Idempotent — skips when present.
             if [ ! -x /usr/local/go/bin/go ]; then
               curl -fsSL https://go.dev/dl/go1.25.5.linux-amd64.tar.gz -o /tmp/go.tgz
               tar -C /usr/local -xzf /tmp/go.tgz && rm -f /tmp/go.tgz
             fi
             ln -sf /usr/local/go/bin/go /usr/local/bin/go
             # GITGUARDIAN_API_KEY is optional; without it ggshield is unavailable
             # and the gate fails closed to the existing keyword scan.
             command -v ggshield >/dev/null || { python3 -m venv /opt/ggshield-venv && /opt/ggshield-venv/bin/pip install -q ggshield && ln -sf /opt/ggshield-venv/bin/ggshield /usr/local/bin/ggshield; }
             git config --global --add safe.directory /opt/wgmesh-pipeline
             cd /opt/wgmesh-pipeline
             git fetch origin main
             OLD=\$(git rev-parse --short HEAD)
             git reset --hard origin/main
             NEW=\$(git rev-parse --short HEAD)
             echo \"code: \$OLD -> \$NEW\"
             .venv/bin/pip install -q -e '/opt/wgmesh-pipeline/pipeline[turso,trace]'
             chown -R wgmesh:wgmesh /opt/wgmesh-pipeline
             # Security hardening (idempotent) — in-place deploys don't re-run
             # cloud-init, so apply the sandbox/firewall/de-tokenization here too,
             # otherwise the run_bash CWE-78 fix ships inert (no bwrap = fallback,
             # no firewall, PAT still in the checkout's .git/config).
             export DEBIAN_FRONTEND=noninteractive
             apt-get update -qq && apt-get install -y bubblewrap iptables-persistent
             install -d -m 0700 -o wgmesh -g wgmesh /var/cache/wgmesh-agent
             iptables -C OUTPUT -d 169.254.169.254 -j REJECT 2>/dev/null || iptables -I OUTPUT -d 169.254.169.254 -j REJECT
             ip6tables -C OUTPUT -d fd00:ec2::254 -j REJECT 2>/dev/null || ip6tables -I OUTPUT -d fd00:ec2::254 -j REJECT
             netfilter-persistent save
             # Drop the PAT from the existing workspace remote (was cloned with a
             # token before this change); set-url is cheaper than a re-clone.
             git config --global --add safe.directory /opt/wgmesh-checkout || true
             [ -d /opt/wgmesh-checkout/.git ] && git -C /opt/wgmesh-checkout remote set-url origin https://github.com/atvirokodosprendimai/wgmesh.git || true
             systemctl restart wgmesh-pipeline
             sleep 8
             systemctl is-active wgmesh-pipeline
             journalctl -u wgmesh-pipeline -n 5 --no-pager"

      - name: Report
        run: echo "Box updated in place at $BOX_IP — service restarted on latest main."
