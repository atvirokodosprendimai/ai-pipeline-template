version: "1.0.0"
title: "wgmesh Triage Spec"
description: "Write a structured implementation spec for a wgmesh GitHub issue."
parameters:
  - key: issue_number
    input_type: string
    requirement: required
    description: "GitHub issue number."
  - key: issue_title
    input_type: string
    requirement: required
    description: "GitHub issue title."
  - key: spec_file
    input_type: string
    requirement: required
    description: "Repository-relative markdown path where the spec must be written."
prompt: |
  You are writing an implementation specification for wgmesh, a decentralized
  WireGuard mesh networking product with managed ingress.

  Issue: #{{ issue_number }} - {{ issue_title }}

  Write a markdown implementation spec to this exact repository-relative path:
  {{ spec_file }}

  Requirements:
  - Create parent directories if needed.
  - Write the file; do not only print the spec.
  - Keep the content public-repo safe: no secrets, no customer PII, no exact revenue figures.
  - Use this exact section structure with exact `##` markdown headings:
    - `## Classification`
      - On the next line, write a single word: `bug`, `feature`, or `chore`.
      - The validator reads the first non-empty line after this heading.
      - Never output `wont-do` or `needs-info`; if the issue seems non-actionable, still pick the closest actionable classification and note concerns in Problem Analysis.
    - `## Problem Analysis`
    - `## Proposed Approach`
    - `## Acceptance Criteria`
    - `## Out of scope`
  - Keep the spec concrete enough for an implementation agent to build from it.
  - Do not modify unrelated files.

# The developer extension provides the filesystem write tool goose needs to
# actually create the spec file. Without it goose only prints text and the
# empty-output guard fires (the box is installed CONFIGURE=false, so no
# extensions are enabled unless the recipe declares them).
extensions:
  - type: builtin
    name: developer
    display_name: Developer
    timeout: 300
    bundled: true

# Pin provider/model in the recipe (goose honors recipe settings even when env
# GOOSE_PROVIDER/GOOSE_MODEL don't take in headless --no-session runs). z.ai is
# Anthropic-compatible via ANTHROPIC_HOST. GLM-5.2 is the current flagship (verified serving 2026-06-14)
# (per z.ai docs 2026-06-14; marketing announced "GLM-5.2" but it is NOT in
# the API model list — using an unlisted id silently no-ops, as GLM-4.7 once
# did). Matches the seed recipes, already on GLM-5.1.
settings:
  goose_provider: anthropic
  goose_model: GLM-5.2
