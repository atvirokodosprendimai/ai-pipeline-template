# Compound Engineering -- local config
# This file is committed in-repo and consumed by workflows at CI runtime
# (for example, goal-sprint reads pulse_seed_product_repo).
# All settings are optional. Invalid values fall through to defaults.

# --- Work delegation (Codex) ---

# work_delegate: codex           # codex | false (default: false)
# work_delegate_consent: true    # true | false (default: false)
# work_delegate_sandbox: yolo    # yolo | full-auto (default: yolo)
# work_delegate_decision: auto   # auto | ask (default: auto)
# work_delegate_model: gpt-5.4   # any valid codex model (omit to use ~/.codex/config.toml default)
# work_delegate_effort: high     # minimal | low | medium | high | xhigh (omit to use ~/.codex/config.toml default)

# --- Product Pulse (ce-product-pulse) ---
#
# 2026-05-06 correction: pulse_primary_event was bot_pr_merged, which
# counted heal:/loop: maintenance PRs in this meta-pipeline repo as
# product convergence. STRATEGY.md says convergence happens in the
# SEEDED PRODUCT repo (atvirokodosprendimai/wgmesh). Repointed events
# accordingly. See docs/pulse-reports/2026-05-06_05-30-corrected.md
# for the incident.

pulse_product_name: ai-pipeline-template
# pulse_seed_product_repo identifies where actual PRODUCT convergence
# is measured (the wgmesh AGPL mesh software). NOT used by the upstream
# ce-product-pulse skill yet, but consumed by the corrected pulse
# generation in this repo and by goal-sprint surface routing.
pulse_seed_product_repo: atvirokodosprendimai/wgmesh
# pulse_service_repo identifies the SERVICE / monetization surface
# (cloudroof managed hosting GTM). Product-vs-service split, 2026-06-21
# (see docs/plans/2026-06-21-003-feat-product-service-split-plan.md):
# the pulse attributes product traction (wgmesh: stars/releases/convergence)
# and service revenue (cloudroof: subscribers/trials) on SEPARATE lines so the
# "seed products 0" attribution ambiguity is resolved. goal-sprint routes
# surface:service bets here; surface:product bets to pulse_seed_product_repo.
pulse_service_repo: atvirokodosprendimai/cloudroof-eu
pulse_primary_event: product_pr_merged
pulse_value_event: autonomous_impl_merge_clean
pulse_completion_events: paid_customer_added
pulse_quality_scoring: false
pulse_analytics_source: github-pr-data
pulse_tracing_source: github-actions
pulse_payments_source: polar
pulse_db_enabled: false
pulse_lookback_default: 24h
# Per-metric source notes:
#   autonomous_ship_rate  = impl: PRs merged in seed repo with no escalation_posted events
#   lead_time_hours       = median(spec_pr_opened_at → impl_pr_merged_at) per Issue #N
#   spec_coverage         = (issues with spec PR) / (open issues in seed repo)
#   active_stuck_issues   = needs-human OR copilot-triaging >24h OR retry cooldown >24h
#   self_heal_rate        = company/pipeline-health-state.json on this repo (issues_healed_total/checks_run)
#   paid_customers        = chimney HTML scrape (until Polar webhook integration)
#   cycle_time_to_revenue = pending Polar integration; null today
#   pr_processing_rate    = goal-aligned-terminal / dispositioned. PROCESSED = merged
#                           OR closed-with-written-reason that cites the goal. Bulk-close
#                           with no reason does NOT count as processed — it is discard.
#                           Open PRs are not "processed"; they are work-in-flight or dwell.
#   pr_dwell_violations   = open PRs older than pulse_pr_processing_sla_days with no
#                           review/merge action — the unprocessed-defect count.
#   aged_open_items       = open issues AND open PRs whose age (now - createdAt) exceeds
#                           pulse_open_age_sla_hours, in EITHER repo, with no terminal
#                           action. The unprocessed-defect count at 48h granularity —
#                           tighter than pr_dwell_violations (7d, PRs only) and also
#                           covers issues. Target 0.
#   mixpost_daily_posts  = Mixpost API — GET ${MIXPOST_BASE}/api/${MIXPOST_WORKSPACE}/posts,
#                          count posts bucketed by calendar day. Source already wired in
#                          .github/workflows/wgmesh-social-drip.yml (secrets MIXPOST_API_TOKEN
#                          + MIXPOST_WORKSPACE, var MIXPOST_BASE default
#                          https://mixpost.infrawei.com/mixpost). Counts ALL posts created
#                          per day (pulse_mixpost_count: all) — drafts included — so a
#                          zero-post day means the drip produced nothing that day.
pulse_metric_sources: paid_customers=chimney-html,autonomous_ship_rate=seed-repo-pr-data,lead_time_hours=seed-repo-pr-data,spec_coverage=seed-repo-pr-data,self_heal_rate=company/pipeline-health-state.json,active_stuck_issues=seed-repo-issues,cycle_time_to_revenue=polar,supervisor_rank_state=company/supervisor-rank-state.json,pr_processing_rate=meta-repo-pr-data,pr_dwell_violations=meta-repo-pr-data,aged_open_items=both-repos-issues-and-prs,mixpost_daily_posts=mixpost
pulse_pending_metrics: cycle_time_to_revenue,spec_coverage
# --- PR-processing KPI (added 2026-06-05) ---
# Intent: open PRs must be ACTED ON per the goal, never bulk-closed to clear backlog.
# Every disposition needs a goal-aligned reason. Dwelling = defect, not idle.
pulse_pr_processing_kpi: enabled
pulse_pr_processing_sla_days: 7

# --- Open-item aging KPI (added 2026-06-20) ---
# Every OPEN issue AND OPEN pull request must reach a terminal action (merge, or
# close-with-goal-reason) within 48h of creation. Anything open and aged > 48h is a
# tracked breach to drive to zero — never normalised as backlog. SCOPE = BOTH repos
# (meta-repo AND seed via pulse_seed_product_repo), mirroring the action-success KPI
# scope so a seed-repo pileup can't hide behind a healthy meta-repo. Age uses createdAt
# (not updatedAt — a bumped label must not reset the clock). A window is clean only when
# aged_open_items == 0; if > 0, the pulse lists each aged item with a disposition.
pulse_open_age_kpi: enabled
pulse_open_age_sla_hours: 48
pulse_open_age_target: 0
pulse_open_age_scope: meta-repo,seed-repo

# --- Social posting cadence KPI (added 2026-06-21) ---
# The social poster (Mixpost) must publish AT LEAST ONE post per day. A window
# is clean only when every calendar day in it has >=1 published post; any
# zero-post day is a tracked breach — silent outreach is a defect, not idle.
# SCOPE = service (cloudroof/wgmesh GTM cadence, per the product-vs-service
# split). Source = the EXISTING Mixpost integration in
# .github/workflows/wgmesh-social-drip.yml: GET
# ${MIXPOST_BASE}/api/${MIXPOST_WORKSPACE}/posts (Bearer MIXPOST_API_TOKEN),
# bucket by day, assert each day >= pulse_mixpost_min_posts_per_day.
# COUNT basis = ALL posts created that day (drafts included). Measures that the
# drip RAN and produced a post each day, not that anything was published. The
# drip creates drafts ("schedule": false), so `all` credits each drafted post;
# a zero-post day means the drip itself didn't run / produced nothing.
pulse_mixpost_kpi: enabled
pulse_mixpost_min_posts_per_day: 1
pulse_mixpost_scope: service
pulse_mixpost_count: all   # all | scheduled | published

# --- Action-success KPI (added 2026-06-06) ---
# Andon/jidoka: EVERY autonomous action the pipeline attempts must succeed.
# A failed action = a tracked breach to drive to zero, never normalised as noise.
# "Action" = a workflow run that attempts a mutation/decision: heal, escalate,
# merge (heartbeat/bot-review), pr-disposition, supervisor-rank publish,
# observation-loop, goal-sprint emit, strategy-audit. NOT actions: `skipped`
# (conditional no-op) and `action_required` (awaiting input) — exclude from the rate.
# Each pulse asserts: failed_actions == 0. If >0, list every failed action with a
# disposition tag — FIXED (root cause + merged fix PR), OPEN (defect still live),
# or TRANSIENT (succeeded on retry, root cause confirmed non-recurring). A window
# is only KPI-clean when every failed action is FIXED or TRANSIENT with proof;
# any OPEN failed action fails the KPI.
#
# SCOPE = BOTH repos. The KPI covers workflow runs in the meta-repo AND in the
# seed repo configured via `pulse_seed_product_repo` (resolved to TARGET_REPO at
# pulse time). Querying only the meta-repo once hid a 2-week seed-repo outage:
# `Copilot Issue Triage` failed `Bad credentials` on every run from ~2026-05-21,
# stalling the entire seed pipeline at triage while the meta-repo read "healthy".
# A pulse MUST run `gh run list --repo <seed>` and disposition seed-repo failures
# too. See docs/pulse-reports/ for the incident write-up.
pulse_action_success_kpi: enabled
pulse_action_success_target: 1.0
pulse_action_success_scope: meta-repo,seed-repo

goal_sprint_enabled: true
goal_sprint_cadence: weekly
goal_sprint_seed_repo_source: pulse_seed_product_repo
# goal-sprint step: weekly LLM-driven ideation that emits one spec issue into
# the autonomous builder chain (atvirokodosprendimai/wgmesh or pulse_seed_product_repo).
# Triggered every Monday 07:00 UTC. Anti-flood: only emits when fingerprint changes.

